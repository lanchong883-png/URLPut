<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URLPut</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <h1>URLPut</h1>
  <section>
    <h2>推广站点</h2>
    <label>当前站点 <select id="sites"></select></label>
    <form id="site-form">
      <label>站点名称 <input id="name" required></label>
      <label>官网地址 <input id="homepage" type="url" placeholder="https://example.com" required></label>
      <button>添加站点</button>
    </form>
  </section>
  <section>
    <h2>导入清单</h2>
    <label>来源 <select id="source">
      <option value="csv">CSV 文件</option>
      <option value="txt">TXT 文件</option>
      <option value="paste-text">粘贴网址或文本</option>
      <option value="paste-table">粘贴表格</option>
    </select></label>
    <label id="file-input">文件 <input id="file" type="file" accept=".csv,.tsv,text/csv"></label>
    <label id="paste-input" hidden>粘贴内容 <textarea id="paste" rows="4"></textarea></label>
    <div id="mapping">
      <label>分隔符 <select id="delimiter"><option value=",">逗号</option><option value=";">分号</option><option value="tab">制表符</option></select></label>
      <label><input id="header" type="checkbox" checked> 首行是表头</label>
      <label>URL 列 <select id="column"></select></label>
    </div>
    <pre id="preview" aria-label="导入预览"></pre>
    <button id="import" type="button" disabled>导入到当前站点</button>
  </section>
  <p id="status" role="status"></p>
  <section>
    <h2>逐行台账</h2>
    <p id="count"></p>
    <button id="export" type="button" disabled>导出 CSV</button>
    <div class="scroll"><table><thead></thead><tbody></tbody></table></div>
  </section>
</main>
<script type="module" src="panel.js"></script>
</body>
</html>
