<style>

  height: 29px;

  box-shadow: inset 0 1px 0 #ffffff44;
}
.brand-mark::before {
  content: "";
  width: 13px;
  height: 10px;
  border: solid #fff;
  border-width: 0 0 2px 2px;
  transform: translateY(-2px) rotate(-45deg);
}
.brand-mark::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border: solid #fff;
  border-width: 2px 2px 0 0;
  transform: translate(4px, -4px);
}

h2 { font-size: 15px; }

.launch-card { border-color: #d2c8f7; }
.stack { display: grid; gap: 7px; }
.list { max-height: 186px; overflow: auto; overscroll-behavior: contain; scrollbar-color: #c8c2de transparent; scrollbar-width: thin; }
.item { padding: 7px 0; border-bottom: 1px solid #ededf5; overflow-wrap: anywhere; }
.item:last-child { border-bottom: 0; }
.item label { display: flex; align-items: flex-start; gap: 7px; cursor: pointer; }
.item label input { margin-top: 3px; }
.item details { margin-top: 7px; margin-bottom: 0; background: #faf9ff; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
fieldset { min-width: 0; margin: 6px 0; padding: 3px 8px 6px; border: 1px solid var(--line); border-radius: 8px; }
legend { padding: 0 4px; color: var(--muted); font-size: 12px; font-weight: 650; }

input:not([type=radio],[type=checkbox]), select, textarea {
  width: 100%;
  min-width: 0;
  min-height: 35px;
  padding: 6px 9px;

.button {

.stats div { padding: 8px 9px; border-radius: 7px; background: #f3f0ff; }
.stats strong { display: block; color: var(--accent-deep); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.meter { height: 8px; overflow: hidden; margin: 7px 0; border-radius: 99px; background: #e9e5fa; }
.meter div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5338ba, #8a69ee); }
.progress-card { padding: 13px; border-color: #d7cdf8; }
.progress-caption { color: var(--muted); font-size: 12px; }
.progress-caption strong { color: var(--accent-deep); font-size: 17px; font-variant-numeric: tabular-nums; }
.attention-card { border-color: #ead4a9; background: #fffcf5; }
.attention-card h2 { color: var(--warm-text); }
.confirmation-toolbar { border-color: #d7cdf8; }
.library-tabs {
  display: flex;
  gap: 3px;
  margin-bottom: 9px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #eeedf7;
}
.library-tabs .button { flex: 1; min-width: 0; }
.library-tabs .secondary { border-color: transparent; background: transparent; }
.task-meter { height: 4px; margin: 4px 0 8px; }
.notice { color: var(--accent-deep); font-size: 12px; }
.notice:empty { display: none; }
.links { overflow-wrap: anywhere; }

dialog {
  width: min(360px, calc(100% - 24px));
  max-height: calc(100dvh - 28px);
  padding: 16px;
  border: 1px solid #d5cef2;
  border-radius: 13px;
  background: #fff;
  color: var(--text);
  box-shadow: 0 18px 54px #21153944;
}
dialog::backdrop { background: #21153966; }
.product-image { max-width: 100%; max-height: 110px; object-fit: contain; border: 1px solid var(--line); border-radius: 7px; }

@media (max-width: 350px) {
  nav { padding-inline: 4px; }
  nav button { font-size: 11px; }
  main { padding-inline: 9px; }
  .card, details { padding-inline: 10px; }
}

<main id="main"></main>

<script>
const numbers = new Intl.NumberFormat('zh-CN');
const n = value => numbers.format(value);
const demoSites = Array.from({length:100},(_,i)=>({id:'site-'+(i+1),name:'brand-'+(i+1)+'.example',url:'https://brand-'+(i+1)+'.example/'}));
const demoLinks = Array.from({length:1000},(_,i)=>({id:'row-'+(i+1),line:i+1,url:'https://channel-'+(i+1)+'.example/submit',entryType:i%2===0?'directory':'resource',siteType:i%2===0?'目录站':'内容社区',status:'active'}));
const storageKey = 'urlput-panel-prototype-v2';
let saved;
try {saved=JSON.parse(localStorage.getItem(storageKey))}catch{}
const sourceNames={paste:'直接粘贴',csv:'CSV 文件',excel:'Excel 工作表',txt:'TXT 文件'};
let sites=(saved?.sites??demoSites).map(({archived,...site})=>({
  ...site,name:new URL(site.url).hostname,deleted:Boolean(site.deleted??archived)
}));
let batches=saved?.batches??[];
let linkLists=saved?.linkLists??[{id:'initial',name:'示例外链清单',source:'csv',links:saved?.links??demoLinks}];
let listId=saved?.listId??'initial';
let taskQuery='',taskFilter='all',taskPageIndex=0,libraryTab='sites',libraryQuery='',editing='',batchName='';
let batch=batches.find(item=>item.id===saved?.batchId)??batches.at(-1)??null;
let picked=new Set(saved?.picked??[]), view='setup', query='', scope='', limit=1000, mode='analysis', notice='';
let pendingSitesOnly=false, libraryFromSetup=false;
const importDraft=()=>({text:'',filename:'',format:'txt',read:0});
const imports={sites:importDraft(),links:importDraft()};
let open=new Set(['sites']), model={type:'local',endpoint:'http://127.0.0.1:11434/v1',name:'',analysis:false,writing:false};
const main = document.querySelector('#main'), nav = document.querySelector('#nav'), dialog=document.querySelector('#dialog');
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({sites,linkLists,listId,batches,batchId:batch?.id,picked:[...picked],clockShift,attempts,pairLedger:[...pairLedger],contentTemplates,defaultTemplateIds,authAccounts}));return true}catch{return false}}
const safe = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const iconPaths={
  plus:'M12 5v14M5 12h14', tasks:'m3 7 2 2 4-5M12 7h9M3 15l2 2 4-5M12 15h9',
  folder:'M3 6h7l2 2h9v11H3z', template:'M5 3h10l4 4v14H5zM8 11h8M8 15h6',
  model:'M7 7h10v10H7zM9 3v4m6-4v4m-6 10v4m6-4v4M3 9h4m10 0h4M3 15h4m10 0h4',
  key:'M14 4a5 5 0 1 1-3 9l-7 7H2v-4l7-7a5 5 0 0 1 5-5zM16 8h.01',
  search:'M16 16l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0z',
  edit:'m4 15 10-10 4 4L8 19l-5 1zM12 7l4 4',
  download:'M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4',
  upload:'M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4',
  back:'M20 12H4m6-6-6 6 6 6', pause:'M8 5v14M16 5v14',
  play:'m7 4 12 8-12 8z', stop:'M5 5h14v14H5z', check:'m4 12 5 5L20 6',
  trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7',
};
function icon(name){
  return '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="'+iconPaths[name]+'"/></svg>';
}
const navIcons={setup:'plus',tasks:'tasks',library:'folder',templates:'template',models:'model','auth-management':'key'};
const actionIcons={
  'new-content':'plus','new-auth-preset':'plus','add-auth-email':'plus',
  'edit-content':'edit','edit-library':'edit','edit-auth-preset':'edit',
  'delete-site':'trash','delete-content':'trash','confirm-delete-site':'trash','confirm-delete-content':'trash',
  export:'download','export-link-list':'download','export-all-links':'download','download-site-columns':'download',
  'download-import-sites':'download','download-import-links':'download',
  'return-content':'back','return-auth':'back','return-setup':'back',tasks:'back',
  resume:'play',pause:'pause',stop:'stop',resolve:'check','check-confirmation':'check',
};
function actionLabel(label,action){
  const name=actionIcons[action];
  return name?icon(name)+label:label;
}
const btn = (label,action,style='')=>'<button class="button '+style+'" data-action="'+action+'">'+actionLabel(label,action)+'</button>';
const stepTitle = (number,label)=>'<span class="step-title"><b>'+number+'</b> '+label+'</span>';
const pageBanner = title=>'<div class="page-banner"><h1>'+title+'</h1><span class="banner-mark" aria-hidden="true"></span></div>';
const detail = (id,title,body)=>'<details data-section="'+id+'" '+(open.has(id)?'open':'')+'><summary>'+title+'</summary>'+body+'</details>';
const matchSites=()=>sites.filter(site=>!site.deleted&&matches(site.name+' '+site.url,query)&&(!pendingSitesOnly||siteCounts(site).pending>0));
const selected=()=>sites.filter(site=>!site.deleted&&picked.has(site.id));
const currentList=()=>linkLists.find(list=>list.id===listId);
const perSite=()=>Math.min(activeLinks(currentList()).length,limit);
const reviewLabels={new:'新增',existing:'已有',duplicate:'清单内重复',error:'有问题'};
function checkedUrl(value,kind){
  const raw=value.trim();
  const address=kind==='sites'&&!/^[a-z][a-z\d+.-]*:/i.test(raw)?'https://'+raw:raw;
  if(!/^https?:\/\//i.test(address))return;
  try{
    const url=new URL(address);
    const host=url.hostname.replace(/\.$/,'');
    if(!host.includes('.')||url.username||url.password||/\s/.test(raw))return;
    url.hostname=host;
    url.hash='';
    return url;
  }catch{}
}
const demoLinkFailures=new Map([
  ['offline.example','访问不了：连接失败（模拟）'],
  ['timeout.example','访问不了：请求超时（模拟）'],
  ['closed.example','页面失效：入口已移除（模拟）'],
]);
function simulatedLinkIssue(url){return demoLinkFailures.get(url.hostname)}
function siteCsvRecords(value){
  const text=value.replace(/^\uFEFF/,'');
  const token=/"(?:[^"]|"")*"(?=,|\r|\n|$)|[^,"\r\n]+|[",\r\n]/gy;
  const records=[];
  let fields=[],field='',start=0,line=1,startLine=1,invalid=false;
  const push=end=>{
    const raw=text.slice(start,end);
    if(raw.trim())records.push({line:startLine,raw,fields:[...fields,field],invalid});
    fields=[];field='';invalid=false;
  };
  for(let match;(match=token.exec(text));){
    const part=match[0],at=match.index;
    if(part==='\r'||part==='\n'){
      push(at);
      if(part==='\r'&&text[at+1]==='\n')token.lastIndex++;
      start=token.lastIndex;startLine=++line;
    }else if(part===','){
      fields.push(field);field='';
    }else if(part==='"'){
      invalid=true;field+=part;
    }else if(part.startsWith('"')){
      if(field)invalid=true;
      field+=part.slice(1,-1).replaceAll('""','"');
      line+=(part.match(/\r\n|\n|\r/g)??[]).length;
    }else field+=part;
  }
  push(text.length);
  return records;
}
const siteUrlColumns=['站点网址','推广站点网址','官网','url','网址','域名'];
const csvKey=value=>value.trim().normalize('NFKC').toLowerCase();
function siteImportRows(value){
  const records=siteCsvRecords(value);
  const header=records[0];
  if(!header)return [];
  const headers=header.fields.map(csvKey);
  const urlColumn=headers.findIndex(name=>siteUrlColumns.includes(name));
  if(header.invalid||urlColumn===-1){
    if(records.every(record=>record.fields.length===1))return records.map(record=>({...record,input:record.fields[0]}));
    return records.map(record=>({...record,reason:'多列 CSV 需要「站点网址」表头，可下载导入模板。'}));
  }
  const mapping=headers.map(name=>profileFields.find(field=>csvKey(field.label)===name||csvKey(field.key)===name||
    (field.aliases??[]).includes(name)));
  return records.slice(1).map(record=>{
    const profile={};
    let reason=record.fields.length>headers.length?'资料列数超过表头，请检查 CSV 引号。':undefined;
    mapping.forEach((field,index)=>{
      const value=record.fields[index]?.trim();
      if(!field||!value)return;
      const parsed=profileValue(field,value);
      if(parsed===undefined)reason='请检查'+field.label+'的格式或长度。';
      else profile[field.key]=parsed;
    });
    return {...record,input:record.fields[urlColumn]??'',profile,reason};
  });
}

function compareImport(value,kind,format){
  const known=kind==='sites'?new Map(sites.map(site=>[new URL(site.url).hostname,site])):
    new Map(linkLists.flatMap(list=>list.links.map(link=>[link.url,list])));
  const seen=new Set(),rows=[];
  const records=kind==='sites'&&format==='csv'?siteImportRows(value):
    value.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).map((line,index)=>({line:index+1,raw:line,input:line.trim()}));
  for(const record of records){
    const {line,raw,profile}=record;
    if(!raw.trim())continue;
    if(record.reason||record.invalid){
      rows.push({line,raw,status:'error',reason:record.reason??'CSV 引号格式有误。'});continue;
    }
    let input=record.input;
    if(kind==='links'&&format==='csv'){
      if(!rows.length&&/^(?:"?(?:url|网址|域名|站点网址|外链\s*url)"?)$/i.test(input))continue;
      input=input.replace(/^"([^"]*)"$/,'$1');
    }
    const url=checkedUrl(input,kind);

function submittedForSite(site){

  for(const entry of pairLedger.values()){
    if(entry.siteId===site.id&&entry.status==='done'&&entry.accepted)urls.add(entry.url);
  }
  for(const item of batches){
    if(item.mode!=='execute'||item.daily?.sharedPairs)continue;
    const index=item.sites.findIndex(entry=>entry.id===site.id);
    if(index===-1)continue;
    const start=index*item.links.length;
    const end=item.daily?item.daily.positions[index]:Math.min(item.links.length,item.cursor-start);
    for(let offset=0;offset<end;offset++){
      const position=start+offset;
      if(position===0&&item.manual&&!item.resolved)continue;
      if(position%3!==2)urls.add(item.links[offset].url);
    }
  }
  return urls;
}

function budgetRemaining(item,siteId,now){
  const effective=Math.min(item.daily.quotas[siteId],...batches.filter(other=>other.daily&&!other.stopped&&
    other.cursor<other.sites.length*other.links.length&&Object.hasOwn(other.daily.quotas,siteId)).map(other=>other.daily.quotas[siteId]));
  const used=attempts.reduce((sum,entry)=>sum+(entry.siteId===siteId&&now-entry.at<DAY?entry.count:0),0);
  return Math.max(0,effective-used);
}

function pairKey(site,link){return JSON.stringify([site.id,checkedUrl(link.url,'links')?.href??link.url])}
const pairLedger=new Map(saved?.pairLedger??[]);
const pairFlights=new Map(), activeCycles=new Set();
const simulatedResults=['模拟有效外链','模拟待审核','模拟入口已关闭'];
for(const record of pairLedger.values()){
  if(record.status==='processing'){
    record.status='verify';record.result='上次处理未确认，等待核对提交结果';
  }
}
function updateProgress(){
  persist();
  if(view==='progress'||view==='confirmations')render();
  else{
    renderNav();
    if(view==='tasks'&&!dialog.open)document.querySelector('#task-rows').innerHTML=taskRows();
  }
}
function canDispatch(item){return !item.paused&&!item.interrupted&&!item.stopped}
function finishPair(item,index,link,reference){
  if(reference)(item.daily.skipped[item.sites[index].id]??=[]).push(link.url);
  item.daily.positions[index]++;
  item.cursor++;
  updateProgress();
}
async function handleSiteCycle(item,index,now,history,notes){
  const daily=item.daily,site=item.sites[index];
  let used=0;
  while(canDispatch(item)&&daily.positions[index]<item.links.length){
    const offset=daily.positions[index],link=item.links[offset],key=pairKey(site,link);
    let current=pairLedger.get(key);
    if(current?.status==='processing'){
      await pairFlights.get(key);
      if(!canDispatch(item))break;
      current=pairLedger.get(key);
    }
    if(current?.status==='verify'){
      ((daily.verify??={})[site.id]??=[]).push(key);
      finishPair(item,index,link,false);continue;
    }
    if(current?.status==='done'||history.has(link.url)){
      finishPair(item,index,link,current?.owner!==item.id);continue;
    }
    if(current?.status==='retry'&&current.retryAt>now){
      notes.add('提交前临时失败，等待次日重试');break;
    }
    const content=chooseSubmissionContent(item.publication,site,link);
    if(content===null){
      ((daily.contentBlocked??={})[site.id]??=[]).push(link.url);
      finishPair(item,index,link,false);continue;
    }
    if(!budgetRemaining(item,site.id,now)){notes.add('额度已用完');break}
    if(index===0&&!daily.injectedFailure&&used===1&&offset+1<item.links.length){
      daily.injectedFailure=true;
      daily.retry={siteId:site.id,offset};
      pairLedger.set(key,{siteId:site.id,url:link.url,status:'retry',owner:item.id,retryAt:now+DAY});
      notes.add('提交前临时失败，等待次日重试');updateProgress();break;
    }

    const record={siteId:site.id,url:link.url,status:'processing',owner:item.id,
      content};
    pairLedger.set(key,record);
    const existing=attempts.find(entry=>entry.siteId===site.id&&entry.at===now);
    if(existing)existing.count++;
    else attempts.push({siteId:site.id,count:1,at:now});
    used++;
    const flight=new Promise(resolve=>{
      setTimeout(()=>{
        const outcome=(index*item.links.length+offset)%simulatedResults.length;
        Object.assign(record,{status:'done',accepted:outcome!==2,result:simulatedResults[outcome]});
        finishPair(item,index,link,false);
        resolve();
      },daily.demoDelay??45);
    });
    pairFlights.set(key,flight);
    updateProgress();
    await flight;
    pairFlights.delete(key);
  }
}
async function processCycle(item){
  const now=demoNow(),daily=item.daily;
  if(activeCycles.has(item.id)||daily.nextAt>now)return;
  if(daily.nextAt&&!daily.recurring&&!daily.allowed)return;
  activeCycles.add(item.id);
  daily.allowed=false;
  daily.nextAt=0;
  daily.retry=null;
  attempts=attempts.filter(entry=>now-entry.at<DAY);
  const notes=new Set();
  const histories=item.sites.map(submittedForSite);
  let siteIndex=0;
  const worker=async()=>{
    while(canDispatch(item)&&siteIndex<item.sites.length){
      const index=siteIndex++;
      await handleSiteCycle(item,index,now,histories[index],notes);
    }
  };
  try{
    await Promise.all(Array.from({length:Math.min(8,item.sites.length)},worker));
    if(item.cursor<item.sites.length*item.links.length&&notes.size){
      daily.nextAt=now+DAY;daily.reason=[...notes].join('；');
    }else{daily.nextAt=0;daily.reason=''}
  }finally{
    activeCycles.delete(item.id);
    updateProgress();
  }
}

  const status=item.stopped?'自动执行已关闭':daily.recurring?'每天执行':'单次执行';

}

    draft.body=directory?(site.profile?.summary??'（待补关键描述）'):

    const matching=config.templates.filter(template=>template.category===category);
    const compatible=matching.length?matching:config.templates.filter(template=>!template.category||template.category==='general');
    const template=compatible[Math.floor(Math.random()*compatible.length)];
    if(!template)return null;
    const body=fillTemplateText(template.body,site);
    Object.assign(draft,{templateId:template.id,templateName:template.name,revision:template.revision,
      title:fillTemplateText(template.title,site),
      body:strategy==='hybrid'?(directory?'按目录要求简要介绍：':'结合社区主题推荐：')+body:body});
    if(strategy==='hybrid')draft.pageSummary=pageSummary;
  }
  draft.fields=directory?[
    ['产品名称',draft.title],['官网',site.profile?.landingPage??site.url],['关键描述',draft.body],
    ['产品介绍',site.profile?.description??'待补'],['分类',site.profile?.category??'待补'],['产品图片',String((site.profile?.images?.length??0)+(site.profile?.imageUrls?.length??0))+' 张'],
  ]:[['板块','工具分享（示例）'],['推荐标题',draft.title],['推荐理由与正文',draft.body],['正文链接',site.profile?.landingPage??site.url]];
  return draft;
}

async function verifyAuthRow(item,index){
  const row=item.authDemo[index],key=confirmationKey(item,index);
  if(!canDispatch(item)||row.step==='done'||row.step==='save'||activeAuthChecks.has(key))return;
  activeAuthChecks.add(key);
  row.message='';
  updateProgress();
  await new Promise(resolve=>setTimeout(resolve,250));
  activeAuthChecks.delete(key);
  if(canDispatch(item)){
    if(!row.ready){
      row.message='尚未检测到已完成。请先打开对应页面处理，再回来检查。';
    }else{
      row.ready=false;
      if(row.type==='password'&&row.step==='login'){
        row.step='verify';row.message=row.autoFilled
          ?'已复用 Chrome 中 Google 保存的站点密码，请继续完成邮箱验证。':'登录已核对，请继续完成邮箱验证。';
      }else if(row.type==='password'&&row.step==='verify'&&row.passwordSource&&row.passwordSource!=='existing'){
        row.step='save';row.message='邮箱验证通过。先确认是否保存密码，再继续任务。';
      }else{
        row.step='done';item.cursor++;
      }
    }
  }
  pickedConfirmations.delete(key);
  updateProgress();
}

function unverified(item,site){
  const groups=site?[item.daily?.verify?.[site.id]??[]]:Object.values(item.daily?.verify??{});
  return groups.reduce((sum,keys)=>sum+keys.filter(key=>pairLedger.get(key)?.status==='verify').length,0);
}
function missingContent(item,site){
  const groups=site?[item.daily?.contentBlocked?.[site.id]??[]]:Object.values(item.daily?.contentBlocked??{});
  return groups.reduce((count,urls)=>count+urls.length,0);
}
function metrics(site,batchItem=batch){
  const width=batchItem.links.length, index=site?batchItem.sites.indexOf(site):-1;
  const start=index<0?0:index*width;
  const total=index<0?batchItem.sites.length*width:width;
  // One deliberately held row belongs to the first site.
  const held=batchItem.manual&&start===0?1:0;
  const regular=index>=0&&batchItem.daily?batchItem.daily.positions[index]:Math.max(0,Math.min(total,batchItem.cursor-start));
  const pending=held&&!batchItem.resolved?1:0;
  const dealt=Math.max(0,regular-pending-unverified(batchItem,site)-missingContent(batchItem,site));
  return {total,dealt,pending,percent:Math.floor(dealt*100/total)};
}
function sample(site){
  const targets=site?[site]:batch.sites.slice(0,4);
  return targets.flatMap(target=>batch.links.slice(0,5).map((link,offset)=>{
    const index=batch.sites.indexOf(target)*batch.links.length+offset;
    const auth=batch.authDemo?.[offset];
    if(auth){
      const status=auth.skipped?'已跳过':auth.step==='done'?'已处理':auth.step==='queued'?'排队中':'需人工';
      const result=auth.step==='done'?(auth.skipped?'用户跳过':'确认通过，已继续（模拟）'):auth.step==='queued'?'等待执行':
        auth.step==='verify'?'待邮箱验证':auth.step==='save'?'待保存密码':'待'+authGuides[auth.type].title;
      return {target,link,status,result};
    }
    const pending=index===0&&batch.manual&&!batch.resolved;
    const siteIndex=batch.sites.indexOf(target);
    const complete=(batch.daily?offset<batch.daily.positions[siteIndex]:index<batch.cursor)&&!pending;
    const skipped=batch.daily?.skipped[target.id]?.includes(link.url);
    const shared=batch.mode==='execute'?pairLedger.get(pairKey(target,link)):undefined;
    const sameWork=shared?.owner!==batch.id;
    const waiting=shared?.status==='processing';
    const retry=shared?.status==='retry'||batch.daily?.retry?.siteId===target.id&&batch.daily.retry.offset===offset;
    const blocked=batch.daily?.contentBlocked?.[target.id]?.includes(link.url);
    const status=blocked?'需人工':shared?.status==='verify'?'待核对提交结果':skipped?'已跳过':pending?'需人工':complete?'已处理':waiting?(sameWork?'等待另一批次的处理结果':'处理中'):retry?'待重试':'排队中';
    const result=blocked?'缺少适用模板 · '+templateCategories[simulatedEntryType(link)].label:shared?.status==='verify'?shared.result:skipped?(shared?.result?'复用批次 '+shared.owner+' 的结果 · '+shared.result:'历史已提交'):
      waiting?(sameWork?'批次 '+shared.owner+' 正在处理':'正在等待处理结果'):
      retry?'提交前临时失败，等下一周期':pending?'等待核对账号':!complete?'等待继续':batch.mode==='analysis'?'仅分析 · 已检查入口':
      shared?.result??simulatedResults[index%3];
    return {target,link,status,result,content:shared?.content};
  }));
}

const pageSize=8;
function batchStatus(item){
  const total=item.sites.length*item.links.length;
  if(item.cursor===total&&(!item.manual||item.resolved)&&!unverified(item)&&!missingContent(item))return ['completed','已完成'];
  if(item.stopped)return ['stopped','已停止'];
  if(item.interrupted)return ['interrupted','已中断'];
  if(item.paused)return ['paused','已暂停'];
  if(item.authDemo?.every(row=>row.step!=='queued'))return ['waiting','待确认'];
  if(item.cursor===total)return unverified(item)?['verification','待核对提交结果']:['waiting','待人工'];
  if(item.daily?.nextAt&&(item.daily.nextAt>demoNow()||!item.daily.recurring&&!item.daily.allowed))return ['budget','等待下一轮'];
  return ['running','执行中'];
}
function matches(value,term){return value.toLowerCase().includes(term.trim().toLowerCase())}
function paging(type,count,index){
  const pages=Math.max(1,Math.ceil(count/pageSize));
  if(pages===1)return '';
  return '<div class="row" style="margin-top:8px"><button class="button secondary" data-action="'+type+'-prev" '+(index===0?'disabled':'')+'>上一页</button><small>第 '+(index+1)+' / '+pages+' 页</small><button class="button secondary" data-action="'+type+'-next" '+(index+1>=pages?'disabled':'')+'>下一页</button></div>';
}
function statusTone(state){
  if(state==='completed')return 'success';
  if(['waiting','verification','budget'].includes(state))return 'warm';
  return state==='running'?'':'neutral';
}

function profileValue(field,value){
  if(value.length>field.max)return;
  if(field.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/u.test(value))return;
  if(field.type==='url')return checkedUrl(value,'links')?.href;
  if(field.type==='urls'){
    const lines=value.split(/[\r\n;；]+/).map(line=>line.trim()).filter(Boolean);
    const urls=lines.map(line=>checkedUrl(line,'links')?.href);
    return urls.length&&urls.every(Boolean)?[...new Set(urls)]:undefined;
  }
  return value;
}

function parseLines(value){
  const urls=new Map();
  for(const [index,line] of value.split(/\r?\n/).entries()){
    try {
      const url=new URL(line.trim());
      if(!['https:','http:'].includes(url.protocol)||url.username||url.password)continue;
      url.hash='';
      if(!urls.has(url.href))urls.set(url.href,index+1);
    }catch{}
  }
  return [...urls].map(([url,line])=>({url,line}));
}
function advance(targets=batches){
  let changed=false;
  for(const item of targets){
    const total=item.sites.length*item.links.length;
    if(item.paused||item.interrupted||item.stopped||item.cursor>=total)continue;
    if(item.authDemo){
      const openRows=item.authDemo.filter(row=>row.step==='queued');
      for(const row of openRows){row.step='done';item.cursor++}
      if(openRows.length)changed=true;
      continue;
    }
    if(item.daily){void processCycle(item);continue}
    item.manual=true;
    item.cursor=Math.min(total,item.cursor+Math.max(1,Math.ceil(total/5)));
    changed=true;
  }
  if(changed)updateProgress()
}
function downloadCsv(rows,filename){
  const csvCell=value=>{
    const text=String(value);
    const escaped=/^[=+@\-\t\r\n]/.test(text)?"'"+text:text;
    return '"'+escaped.replaceAll('"','""')+'"';
  };
  const csv=rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
  const anchor=document.createElement('a');anchor.href=url;anchor.download=filename;anchor.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    const issues=(imports[kind].rows??[]).filter(row=>row.status==='error');
    if(issues.length)downloadCsv([['行号','原始内容','问题原因'],...issues.map(row=>[row.line,row.raw,row.reason])],
      'URLPut-'+(kind==='sites'?'站点':'外链')+'导入问题.csv');
    return;
  }
  if(action==='select-all'){for(const site of matchSites())picked.add(site.id);persist();refreshSection('sites');return}
  if(action==='clear'){picked.clear();persist();refreshSection('sites');return}
  if(action==='open-task'){batch=batches.find(item=>String(item.id)===key);scope='';view='progress';open.add('report')}
  if(action==='demo-auth'||action==='demo-synced-password'){
    const id=(batches.at(-1)?.id??0)+1;
    const synced=action==='demo-synced-password';
    const labels=synced?['password','password','google']:['google','password','manual','verify','approval','public'];
    const origins=synced?['matched.example','other.example','google.example']:labels.map(type=>type+'.example');
    const email=authAccounts.email||'publisher@brand-3.example';
    batch={id,name:synced?'Google 已保存密码演示':'第三方认证演示',mode:'execute',sites:[selected()[0]??demoSites[2]],cursor:0,
      authentication:{email,googleEmail:authAccounts.googleEmail,defaultPreset:authAccounts.defaultPreset,
        savedCredentials:authDraft.savedCredentials},
      links:origins.map((host,index)=>({line:index+1,url:'https://'+host+'/submit'})),
      authDemo:labels.map(type=>({type,step:type==='public'?'queued':type==='verify'?'verify':'login'}))};
    if(synced){
      batch.demoSyncedPasswords=[targetLoginKey(batch.links[0].url,email)];
    }
    batches.push(batch);scope='';view='progress';open.add('report');lastTick=performance.now();
    if(synced&&authorizedSavedPassword(batch,0,email)){
      Object.assign(batch.authDemo[0],{ready:true,loginEmail:email,passwordSource:'existing',autoFilled:true});
      void verifyAuthRow(batch,0);
    }else updateProgress();
    return;
  }
  if(action==='auth-open'){if(canDispatch(batch))openAuthStep(batch,Number(key));return}
  if(action==='show-confirmations'){view='confirmations';notice='';render();window.scrollTo(0,0);return}
  if(action==='open-confirmation'||action==='check-confirmation'){
    const entry=pendingAuthEntries().find(entry=>entry.key===key);
    if(!entry)return;
    if(action==='open-confirmation')openAuthStep(entry.item,entry.index);
    else if(authCanCheck(entry.row))void verifyAuthRow(entry.item,entry.index);
    return;
  }
  if(action==='select-confirmations'||action==='check-confirmations'){
    const eligible=pendingAuthEntries().filter(entry=>authCanCheck(entry.row)&&!activeAuthChecks.has(entry.key));
    if(action==='select-confirmations'){
      if(eligible.some(entry=>!pickedConfirmations.has(entry.key)))for(const entry of eligible)pickedConfirmations.add(entry.key);
      else pickedConfirmations.clear();
      render();
    }else{
      const chosen=eligible.filter(entry=>pickedConfirmations.has(entry.key));
      if(!chosen.length)return;
      notice='正在检查 '+chosen.length+' 条。';
      void Promise.all(chosen.map(({item,index})=>verifyAuthRow(item,index))).then(()=>{
        if(view==='confirmations'){
          notice='已检查 '+chosen.length+' 条。未通过核对的条目仍在清单中。';render();
        }
      });
    }
    return;
  }
  if(action==='auth-save-target-password'||action==='auth-decline-target-password'){
    const {item,index}=authDialogTask;
    const row=item.authDemo[index];
    if(!canDispatch(item)||row.step!=='save')return;
    if(action==='auth-save-target-password'){
      const key=targetLoginKey(item.links[index].url,row.loginEmail);
      const saved=authAccounts.savedTargetLogins??=[];
      if(!saved.includes(key))saved.push(key);
    }
    row.step='done';row.message='';item.cursor++;
    dialog.close();dialog.innerHTML='';authDialogTask=undefined;updateProgress();return;
  }
  if(action==='auth-login-failed'){
    const {item,index}=authDialogTask;
    const row=item.authDemo[index];
    row.ready=false;
    row.message='登录未通过，请核对账号或手动选择另一套已知密码。';
    dialog.close();dialog.innerHTML='';authDialogTask=undefined;updateProgress();return;
  }
  if(action==='auth-check'){void verifyAuthRow(batch,Number(key));return}
  if(action==='auth-skip'||action==='auth-confirm'||action==='auth-mark-ready'){
    const {item,index}=authDialogTask;
    if(!canDispatch(item))return;
    const row=item.authDemo[index];
    if(action==='auth-skip'){
      row.step='done';row.skipped=true;item.cursor++;
    }else{
      if(row.type==='password'&&row.step==='login'){
        const email=dialog.querySelector('#auth-email'),password=dialog.querySelector('#auth-password');
        const source=dialog.querySelector('#auth-password-source').value;
        if(!email.value||!email.checkValidity()||(source==='manual'?!password.value:source!=='existing'&&!sessionPasswords.has(source))){
          dialog.querySelector('#auth-error').textContent='请输入示例邮箱和密码。';return;
        }
        row.loginEmail=email.value.trim();row.passwordSource=source;
        email.value='';password.value='';
      }
      row.ready=true;
      if(action==='auth-mark-ready')row.message='已记录模拟页面完成信号，可以统一检查。';
    }
    dialog.close();dialog.innerHTML='';authDialogTask=undefined;
    if(action==='auth-confirm')void verifyAuthRow(item,index);
    else updateProgress();
    return;
  }
  if(action==='demo-concurrent'){
    const id=(batches.at(-1)?.id??0)+1;
    const site=demoSites[2],link={id:'demo-overlap-'+id,line:1,url:'https://concurrent-'+id+'.example/submit'};
    const created=['去重演示 A','去重演示 B'].map((name,index)=>({
      id:id+index,name,sites:[site],links:[link],mode:'execute',cursor:0,
      daily:{sharedPairs:true,defaultQuota:10,recurring:true,quotas:{[site.id]:10},positions:[0],skipped:{},nextAt:0,
        allowed:false,injectedFailure:false,demoDelay:1000}
    }));
    batches.push(...created);
    batch=created[1];scope='';view='progress';open.add('report');
    lastTick=performance.now();
    advance(created);render();return;
  }
  if(action==='demo-history'){
    const examples=[['品牌目录回访',5,false,false],['社区测试批次',2,true,false],['海外目录检查',2,false,true]];
    batches=examples.map(([name,cursor,paused,interrupted],index)=>({id:index+1,name,sites:demoSites.slice(0,1),links:demoLinks.slice(0,5),
      mode:'analysis',cursor,paused,interrupted,manual:cursor>0,resolved:cursor===5}));
  }
  if(action==='task-prev'||action==='task-next'){taskPageIndex+=action==='task-next'?1:-1}
  if(action==='preview-library-links'){
    libraryPreviewId=key;resetLinkBrowse();render();main.querySelector('#library-link-preview').scrollIntoView({block:'nearest'});return;
  }
  if(['manage-sites','manage-links','library-sites','library-links'].includes(action)){
    const fromSetup=action.startsWith('manage-');
    view='library';libraryTab=action.endsWith('sites')?'sites':'links';libraryQuery='';browseCounts.library=browseStep;resetLinkBrowse();
    if(fromSetup){
      libraryFromSetup=true;
      open.add('import-'+libraryTab);
      notice='';render();window.scrollTo(0,0);return;
    }
  }
  const records=libraryTab==='sites'?sites:linkLists;
  if(action==='export-link-list'||action==='export-all-links'){
    const lists=action==='export-all-links'?linkLists:linkLists.filter(list=>list.id===key);
    if(!lists.length)return;
    const rows=lists.flatMap(list=>activeLinks(list).map(link=>[list.name,sourceNames[list.source]??'',link.line,link.url,linkDomain(link),websiteType(link)]));
    const label=(action==='export-all-links'?'全部外链清单':lists[0].name).replace(/[\\/:*?"<>|]/g,'_');
    downloadCsv([['外链清单','来源类型','来源行','外链 URL','网站域名','网站类型'],...rows],'URLPut-'+label+'.csv');
    return;
  }
  if(action==='remove-profile-image'){
    profileImages.splice(Number(key),1);
    dialog.querySelector('#profile-image-preview').innerHTML=profileImagePreview();
    return;
  }
  if(action==='edit-library'){openEditor(records.find(item=>item.id===key));return}
  if(action==='delete-site'){
    const site=sites.find(item=>item.id===key&&!item.deleted);
    if(!site)return;
    dialog.innerHTML='<h2 id="editor-title">删除推广站点？</h2><p>'+safe(site.name)+'</p>'+
      '<p>该站点将从清单和新批次选项移除。已启动批次仍按原清单执行，可在任务页单独停止。</p>'+
      '<div class="actions">'+entityButton('确认删除','confirm-delete-site',site.id)+btn('取消','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-delete-site'){
    sites=sites.map(site=>site.id===key?{...site,deleted:true}:site);
    picked.delete(key);
    if(limitSite===key)limitSite='';
    dialog.close();
    notice='站点已删除。历史批次仍可查看。';
    persist();render();return;
  }
  if(action==='close-dialog'){dialog.close();dialog.innerHTML='';return}
  if(action==='save-edit'){
    const isSite=libraryTab==='sites';
    const site=isSite?sites.find(item=>item.id===editing):undefined;
    const name=site?.name;
    const rows=isSite?[]:parseLines(document.querySelector('#edit-links').value);
    const url=isSite?checkedUrl(document.querySelector('#edit-url').value,'sites'):undefined;
    if(isSite&&(!url||url.hostname!==name)){
      document.querySelector('#editor-error').textContent='请输入同域名的有效网址。更换域名请添加新站点。';return;
    }
    if(!isSite&&rows.some(row=>simulatedLinkIssue(new URL(row.url)))){
      document.querySelector('#editor-error').textContent='有些外链无法打开或已失效。请在「录入或导入外链」里点击「检查外链」，查看具体网址。';return;
    }
    if(!isSite&&!rows.length){
      document.querySelector('#editor-error').textContent='请填写有效外链网址。';return;
    }
    if(isSite){
      if(loadingProfileImages){document.querySelector('#editor-error').textContent='正在读取图片，请稍候。';return}
      const profile=readProfile(document.querySelector('#editor-error'),site.profile);
      if(!profile)return;
      const sameProfile=JSON.stringify(site.profile??{})===JSON.stringify(profile);
      const previousSites=sites;
      sites=sites.map(item=>item.id===editing?{...item,url:url.href,profile,
        profileVersion:(item.profileVersion??0)+(sameProfile?0:1)}:item);
      if(!persist()){
        sites=previousSites;
        document.querySelector('#editor-error').textContent='浏览器存储空间不足，请减少上传图片或改填图片网址。';
        return;
      }
    }
    else linkLists=linkLists.map(list=>{
      if(list.id!==editing)return list;
      const visible=activeLinks(list);
      if(rows.length===visible.length&&rows.every((row,index)=>row.url===visible[index].url))return list;
      const previous=new Map(list.links.map(link=>[link.url,link]));
      const edited=new Set(rows.map(row=>row.url));
      const inactive=list.links.filter(link=>link.status&&link.status!=='active'&&!edited.has(link.url));
      const links=rows.map(row=>previous.get(row.url)??{...row,id:crypto.randomUUID(),status:'active'});
      return {...list,links:[...inactive,...links]};
    });
    dialog.close();
  }
  if(action==='start'&&canStartBatch()){
    const list=currentList();
    batch={id:(batches.at(-1)?.id??0)+1,name:batchName.trim(),listName:list.name,sites:selected(),links:activeLinks(list).slice(0,perSite()),mode,source:list.source,
      cursor:0,paused:false,interrupted:false,manual:false,resolved:false};batchName='';
    if(mode==='execute'){
      batch.authentication={...authDraft,email:authAccounts.email,googleEmail:authAccounts.googleEmail,
        defaultPreset:authAccounts.defaultPreset};
      batch.publication=contentStrategy==='ai'?{strategy:'ai'}:
        {strategy:contentStrategy,templates:chosenTemplates().map(template=>({...template}))};
      batch.daily={sharedPairs:true,defaultQuota:dailyLimit,recurring,quotas:Object.fromEntries(batch.sites.map(site=>[site.id,Object.hasOwn(overrides,site.id)?overrides[site.id]:dailyLimit])),
        positions:batch.sites.map(()=>0),skipped:{},nextAt:0,reason:'',allowed:false,injectedFailure:false};
    }
    batches.push(batch);
    pickedTemplates=null;contentStrategy='templates';
    scope='';view='progress';lastTick=performance.now();open.add('report');
  }
  if(action==='advance'){lastTick=performance.now();advance([batch]);return}
  if(action==='pause'){batch.paused=true;lastTick=performance.now()}
  if(action==='resume'){batch.paused=false;batch.interrupted=false;batch.stopped=false;lastTick=performance.now()}
  if(action==='next-cycle'){
    clockShift+=DAY;
    if(batch.daily)batch.daily.allowed=true;
    lastTick=performance.now();advance();return;
  }
  if(action==='stop'){
    dialog.innerHTML='<h2 id="editor-title">停止当前批次？</h2><p>停止后关闭自动执行并保留结果。手动继续可重新启用原有周期。</p><div class="actions">'+btn('确认停止','confirm-stop')+btn('返回','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-stop'){batch.stopped=true;batch.paused=false;batch.interrupted=false;dialog.close()}
  if(action==='interrupt'){
    dialog.innerHTML='<h2 id="editor-title">中断当前批次？</h2><p>停止该批次并保留已经处理的记录。以后可以从保存的进度继续。</p><div class="actions">'+btn('确认中断','confirm-interrupt')+btn('返回','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-interrupt'){batch.interrupted=true;batch.paused=false;dialog.close()}
  if(action==='resolve')batch.resolved=true;
  if(action==='export'){exportSample();return}
  if(action==='save-model'){
    model={type:document.querySelector('#model-type').value,endpoint:document.querySelector('#endpoint').value,
      name:document.querySelector('#model-name').value,analysis:document.querySelector('#model-analysis').checked,writing:document.querySelector('#model-writing').checked};
    notice='已保存本次演示设置。';render();return;
  }
  notice='';persist();render();
});
setInterval(()=>{if(performance.now()-lastTick>=4500){lastTick=performance.now();advance()}},300);
render();
</script>
</html>
