<script>
const numbers = new Intl.NumberFormat('zh-CN');
const n = value => numbers.format(value);
const demoSites = Array.from({length:100},(_,i)=>({id:'site-'+(i+1),name:'brand-'+(i+1)+'.example',url:'https://brand-'+(i+1)+'.example/'}));
const demoLinks = Array.from({length:1000},(_,i)=>({id:'row-'+(i+1),line:i+1,url:'https://channel-'+(i+1)+'.example/submit'}));
const storageKey = 'urlput-panel-prototype-v2';
let saved;
try {saved=JSON.parse(localStorage.getItem(storageKey))}catch{}
const sourceNames={paste:'直接粘贴',csv:'CSV 文件',excel:'Excel 工作表',txt:'TXT 文件'};
let sites=(saved?.sites??demoSites).map(({archived,...site})=>({
  ...site,name:new URL(site.url).hostname,deleted:Boolean(site.deleted??archived)
}));
let batches=saved?.batches??[];
let linkLists=saved?.linkLists??[{id:'initial',name:'示例外链清单',source:'csv',links:saved?.links??demoLinks}];
let listId=saved?.listId??'initial';
let taskQuery='',taskFilter='all',taskPageIndex=0,libraryTab='sites',libraryQuery='',libraryPageIndex=0,editing='',batchName='';
let batch=batches.find(item=>item.id===saved?.batchId)??batches.at(-1)??null;
let picked=new Set(saved?.picked??[]), view='setup', query='', scope='', limit=1000, mode='analysis', notice='';
let pendingSitesOnly=false, libraryFromSetup=false;
const imports={sites:{text:'',filename:'',format:'txt'},links:{text:'',filename:'',format:'txt',name:''}};
let open=new Set(['sites']), model={type:'local',endpoint:'http://127.0.0.1:11434/v1',name:'',analysis:false,writing:false};
const main = document.querySelector('#main'), nav = document.querySelector('#nav'), dialog=document.querySelector('#dialog');
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({sites,linkLists,listId,batches,batchId:batch?.id,picked:[...picked],clockShift,attempts,pairLedger:[...pairLedger],contentTemplates,defaultTemplateId}))}catch{}}
const safe = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const btn = (label,action,style='')=>'<button class="button '+style+'" data-action="'+action+'">'+label+'</button>';
const detail = (id,title,body)=>'<details data-section="'+id+'" '+(open.has(id)?'open':'')+'><summary>'+title+'</summary>'+body+'</details>';
const matchSites=()=>sites.filter(site=>!site.deleted&&matches(site.name+' '+site.url,query)&&(!pendingSitesOnly||siteCounts(site).pending>0));
const selected=()=>sites.filter(site=>!site.deleted&&picked.has(site.id));
const currentList=()=>linkLists.find(list=>list.id===listId);
const perSite=()=>Math.min(currentList()?.links.length??0,limit);
const reviewLabels={new:'新增',existing:'已有',duplicate:'清单内重复',error:'有问题'};
function checkedUrl(value,kind){
  const raw=value.trim();
  const address=kind==='sites'&&!/^[a-z][a-z\d+.-]*:/i.test(raw)?'https://'+raw:raw;
  if(!/^https?:\/\//i.test(address))return;
  try{
    const url=new URL(address);
    const host=url.hostname.replace(/\.$/,'');
    if(!host.includes('.')||url.username||url.password||/\s/.test(raw))return;
    url.hostname=host;
    url.hash='';
    return url;
  }catch{}
}
function compareImport(value,kind,format){
  const known=kind==='sites'?new Map(sites.map(site=>[new URL(site.url).hostname,site])):
    new Map(linkLists.flatMap(list=>list.links.map(link=>[link.url,list])));
  const seen=new Set(),rows=[];
  for(const [index,line] of value.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).entries()){
    const raw=line.trim();
    if(!raw)continue;
    let input=raw;
    if(format==='csv'){
      if(!rows.length&&/^(?:"?(?:url|网址|域名|站点网址|外链\s*url)"?)$/i.test(input))continue;
      input=input.replace(/^"([^"]*)"$/,'$1');
    }
    const url=checkedUrl(input,kind);
    if(!url){
      rows.push({line:index+1,raw,status:'error',reason:kind==='sites'?'请输入有效域名或 HTTP/HTTPS 站点网址。':'请输入完整的 HTTP/HTTPS 外链网址。'});
      continue;
    }
    const key=kind==='sites'?url.hostname:url.href;
    const previous=known.get(key);
    const status=seen.has(key)?'duplicate':previous&&!previous.deleted?'existing':'new';
    seen.add(key);
    rows.push({line:index+1,raw,url:url.href,key,previous,status,
      name:kind==='sites'?url.hostname:previous?.name??url.hostname,
      reason:status==='duplicate'?'本次输入已有相同项':previous?.deleted?'可重新添加，保留原站点历史':status==='existing'?'已保存在清单':'可加入清单'});
  }
  return rows;
}
function reviewMarkup(kind){
  const draft=imports[kind],label=kind==='sites'?'站点':'外链',rows=draft.rows;
  const summary=rows?Object.entries(reviewLabels).map(([key,title])=>title+' '+n(rows.filter(row=>row.status===key).length)).join(' · '):'';
  const preview=rows?'<p class="hint" role="status">'+summary+'</p>'+
    '<div class="list" aria-label="'+label+'检查明细">'+rows.map(row=>'<div class="item"><div class="row"><strong>第 '+row.line+' 行</strong><span class="chip '+(row.status==='error'||row.status==='duplicate'?'warm':'')+'">'+reviewLabels[row.status]+'</span></div><div class="links">'+safe(row.raw)+'</div><small>'+safe(row.reason)+(kind==='sites'&&row.url?' · 站点名称 '+safe(row.name):'')+'</small></div>').join('')+'</div>':'';
  const usable=!draft.saved&&rows?.some(row=>row.status==='new'||row.status==='existing');
  return detail('import-'+kind,'录入或导入'+label,
    '<label class="field">录入'+label+'（每行一个）<textarea id="input-'+kind+'" rows="3" placeholder="'+(kind==='sites'?'brand.example':'https://directory.example/submit')+'">'+safe(draft.text)+'</textarea></label>'+
    '<label class="field">上传'+label+'文件<input id="file-'+kind+'" type="file" accept=".txt,.csv,text/plain,text/csv"></label>'+
    '<p class="hint">'+(kind==='sites'?'默认用域名作为站点名称。':'TXT 或单列 CSV。如需 Excel，可从已保存的外链清单选择。')+(draft.filename?' · '+safe(draft.filename):'')+'</p>'+
    (kind==='links'?'<label class="field">新外链清单名称<input id="import-list-name" value="'+safe(draft.name)+'"></label>':'')+
    btn('检查'+label,'review-'+kind,'secondary')+
    (draft.error?'<p class="hint" role="alert">'+safe(draft.error)+'</p>':'')+preview+
    (usable?btn(libraryFromSetup?'保存并返回批次':kind==='sites'?'保存有效站点':'保存有效外链清单','accept-'+kind):''));
}
function submittedForSite(site){
  const urls=new Set();
  if(site.id==='site-1'||site.id==='site-2'){
    for(const link of demoLinks.slice(0,site.id==='site-1'?240:1000))urls.add(link.url);
  }
  for(const entry of pairLedger.values()){
    if(entry.siteId===site.id&&entry.status==='done'&&entry.accepted)urls.add(entry.url);
  }
  for(const item of batches){
    if(item.mode!=='execute'||item.daily?.sharedPairs)continue;
    const index=item.sites.findIndex(entry=>entry.id===site.id);
    if(index===-1)continue;
    const start=index*item.links.length;
    const end=item.daily?item.daily.positions[index]:Math.min(item.links.length,item.cursor-start);
    for(let offset=0;offset<end;offset++){
      const position=start+offset;
      if(position===0&&item.manual&&!item.resolved)continue;
      if(position%3!==2)urls.add(item.links[offset].url);
    }
  }
  return urls;
}
function siteCounts(site,pool=currentList()?.links??[],submitted=submittedForSite(site)){
  const total=new Set(pool.map(link=>link.url));
  const count=[...total].filter(url=>submitted.has(url)).length;
  return {total:total.size,submitted:count,pending:total.size-count};
}
function selectedPending(){
  const pool=(currentList()?.links??[]).slice(0,perSite());
  if(!pool.length)return 0;
  return selected().reduce((total,site)=>total+siteCounts(site,pool).pending,0);
}

const DAY=24*60*60*1000;
let dailyLimit=10, recurring=true, limitSite='', overrides={};
let clockShift=saved?.clockShift??0, attempts=saved?.attempts??[];
const demoNow=()=>Date.now()+clockShift;
function integerQuota(value){return Math.max(1,Math.min(1000,Math.floor(Number(value)||1)))}
function limitsMarkup(){
  if(mode!=='execute')return '';
  const targets=selected();
  const override=targets.find(site=>site.id===limitSite);
  return '<section class="card"><h2>提交频率</h2>'+
    '<label class="field">每站 24 小时默认尝试上限<input id="daily-limit" type="number" min="1" max="1000" value="'+dailyLimit+'"></label>'+
    '<label class="field">单站额度可选<select id="limit-site"><option value="">选择站点</option>'+targets.map(site=>'<option value="'+safe(site.id)+'" '+(site.id===limitSite?'selected':'')+'>'+safe(site.name)+'</option>').join('')+'</select></label>'+
    (override?'<label class="field">该站 24 小时尝试上限<input id="site-limit" type="number" min="1" max="1000" value="'+(Object.hasOwn(overrides,override.id)?overrides[override.id]:dailyLimit)+'"></label>':'')+
    '<label class="check"><input type="checkbox" id="recurring" '+(recurring?'checked':'')+'>每天执行，自动续跑</label>'+
    '<p class="hint">按滚动 24 小时统计，每站跨批次共享额度。达到上限后保留进度。设定合适的额度并遵守目标平台规则。</p></section>';
}
function budgetRemaining(item,siteId,now){
  const effective=Math.min(item.daily.quotas[siteId],...batches.filter(other=>other.daily&&!other.stopped&&
    other.cursor<other.sites.length*other.links.length&&Object.hasOwn(other.daily.quotas,siteId)).map(other=>other.daily.quotas[siteId]));
  const used=attempts.reduce((sum,entry)=>sum+(entry.siteId===siteId&&now-entry.at<DAY?entry.count:0),0);
  return Math.max(0,effective-used);
}
// The demo runs in one page. Claim synchronously before the async work yields.
function pairKey(site,link){return JSON.stringify([site.id,checkedUrl(link.url,'links')?.href??link.url])}
const pairLedger=new Map(saved?.pairLedger??[]);
const pairFlights=new Map(), activeCycles=new Set();
const simulatedResults=['模拟有效外链','模拟待审核','模拟入口已关闭'];
for(const record of pairLedger.values()){
  if(record.status==='processing'){
    record.status='verify';record.result='上次处理未确认，等待核验';
  }
}
function updateProgress(){
  persist();
  if(view==='progress')render();
  if(view==='tasks'&&!dialog.open)document.querySelector('#task-rows').innerHTML=taskRows();
}
function canDispatch(item){return !item.paused&&!item.interrupted&&!item.stopped}
function finishPair(item,index,link,reference){
  if(reference)(item.daily.skipped[item.sites[index].id]??=[]).push(link.url);
  item.daily.positions[index]++;
  item.cursor++;
  updateProgress();
}
async function handleSiteCycle(item,index,now,history,notes){
  const daily=item.daily,site=item.sites[index];
  let used=0;
  while(canDispatch(item)&&daily.positions[index]<item.links.length){
    const offset=daily.positions[index],link=item.links[offset],key=pairKey(site,link);
    let current=pairLedger.get(key);
    if(current?.status==='processing'){
      await pairFlights.get(key);
      if(!canDispatch(item))break;
      current=pairLedger.get(key);
    }
    if(current?.status==='verify'){
      ((daily.verify??={})[site.id]??=[]).push(key);
      finishPair(item,index,link,false);continue;
    }
    if(current?.status==='done'||history.has(link.url)){
      finishPair(item,index,link,current?.owner!==item.id);continue;
    }
    if(current?.status==='retry'&&current.retryAt>now){
      notes.add('提交前临时失败，等待次日重试');break;
    }
    if(!budgetRemaining(item,site.id,now)){notes.add('额度已用完');break}
    if(index===0&&!daily.injectedFailure&&used===1&&offset+1<item.links.length){
      daily.injectedFailure=true;
      daily.retry={siteId:site.id,offset};
      pairLedger.set(key,{siteId:site.id,url:link.url,status:'retry',owner:item.id,retryAt:now+DAY});
      notes.add('提交前临时失败，等待次日重试');updateProgress();break;
    }

    const record={siteId:site.id,url:link.url,status:'processing',owner:item.id,
      content:chooseSubmissionContent(item.publication,site,link)};
    pairLedger.set(key,record);
    const existing=attempts.find(entry=>entry.siteId===site.id&&entry.at===now);
    if(existing)existing.count++;
    else attempts.push({siteId:site.id,count:1,at:now});
    used++;
    const flight=new Promise(resolve=>{
      setTimeout(()=>{
        const outcome=(index*item.links.length+offset)%simulatedResults.length;
        Object.assign(record,{status:'done',accepted:outcome!==2,result:simulatedResults[outcome]});
        finishPair(item,index,link,false);
        resolve();
      },daily.demoDelay??45);
    });
    pairFlights.set(key,flight);
    updateProgress();
    await flight;
    pairFlights.delete(key);
  }
}
async function processCycle(item){
  const now=demoNow(),daily=item.daily;
  if(activeCycles.has(item.id)||daily.nextAt>now)return;
  if(daily.nextAt&&!daily.recurring&&!daily.allowed)return;
  activeCycles.add(item.id);
  daily.allowed=false;
  daily.nextAt=0;
  daily.retry=null;
  attempts=attempts.filter(entry=>now-entry.at<DAY);
  const notes=new Set();
  const histories=item.sites.map(submittedForSite);
  let siteIndex=0;
  const worker=async()=>{
    while(canDispatch(item)&&siteIndex<item.sites.length){
      const index=siteIndex++;
      await handleSiteCycle(item,index,now,histories[index],notes);
    }
  };
  try{
    await Promise.all(Array.from({length:Math.min(8,item.sites.length)},worker));
    if(item.cursor<item.sites.length*item.links.length&&notes.size){
      daily.nextAt=now+DAY;daily.reason=[...notes].join('；');
    }else{daily.nextAt=0;daily.reason=''}
  }finally{
    activeCycles.delete(item.id);
    updateProgress();
  }
}
function cycleMarkup(item){
  if(!item.daily)return '';
  const daily=item.daily;
  const status=item.stopped?'自动执行已关闭':daily.recurring?'每天执行':'单次执行';
  return '<p class="hint">'+status+' · 每站 24 小时默认上限 '+daily.defaultQuota+' 次</p>'+
    (daily.nextAt&&!item.stopped?'<p class="hint">'+safe(daily.reason)+'</p><p class="hint">下轮最早 · '+safe(new Date(daily.nextAt).toLocaleString('zh-CN'))+'</p>':'');
}

const starterTemplates = [
  {id:'intro',revision:1,name:'站点简介',title:'了解 {{站点名称}}',body:'{{站点名称}} 提供易上手的工具。访问 {{站点网址}} 了解详情。'},
  {id:'resource',revision:1,name:'资源推荐',title:'推荐资源：{{站点名称}}',body:'分享一个实用资源：{{站点名称}}（{{站点网址}}）。'},
];
let contentTemplates=saved?.contentTemplates??starterTemplates;
let defaultTemplateId=saved?.defaultTemplateId??'intro';
let contentStrategy='templates', pickedTemplates=null, editingTemplate='', settingsFromSetup=false;

function chosenTemplates(){
  const ids=pickedTemplates??new Set([defaultTemplateId]);
  return contentTemplates.filter(template=>ids.has(template.id));
}
function canStartBatch(){
  return picked.size&&perSite()&&(mode!=='execute'||contentStrategy==='ai'||chosenTemplates().length);
}
function contentOptions(){
  if(mode!=='execute')return '';
  const selectedIds=new Set(chosenTemplates().map(template=>template.id));
  const choices=contentTemplates.map(template=>
    '<label class="check item"><input type="checkbox" data-content-id="'+safe(template.id)+'" '+(selectedIds.has(template.id)?'checked':'')+'>'+
    '<span>'+safe(template.name)+(template.id===defaultTemplateId?' <span class="chip">默认</span>':'')+'</span></label>'
  ).join('');
  return '<section class="card"><h2>投稿内容</h2>'+
    '<label class="field">内容来源<select id="content-strategy"><option value="templates" '+(contentStrategy==='templates'?'selected':'')+'>从内容模板选择</option>'+
    '<option value="ai" '+(contentStrategy==='ai'?'selected':'')+'>AI 根据目标网页拟写</option></select></label>'+
    (contentStrategy==='templates'?'<p class="hint">可以多选。每条外链从选中的模板随机取一份，记录使用的版本。</p>'+
      '<div class="list" aria-label="可选内容模板">'+choices+'</div><p class="hint" id="content-count">已选 '+selectedIds.size+' 份模板</p>':
      '<p class="hint">AI 用目标网页的主题和要求拟写。原型生成示例预览。正式执行遇到模型不可用或网页信息不足时，转人工处理。</p>')+
    btn('管理内容模板','manage-content','secondary')+'</section>';
}
function templateSettings(){
  return '<section class="card"><div class="row"><h2>内容模板</h2>'+btn('新增模板','new-content','secondary')+'</div>'+
    '<p class="hint">新建执行批次时预选默认模板。可在批次中另选或多选。</p>'+
    '<div class="list" aria-label="内容模板库">'+contentTemplates.map(template=>
      '<div class="item"><div class="row"><strong>'+safe(template.name)+'</strong>'+
      (template.id===defaultTemplateId?'<span class="chip">默认</span>':'')+'</div>'+
      '<p class="hint truncate">'+safe(template.title)+'</p><div class="actions">'+
      entityButton('编辑','edit-content',template.id)+
      (template.id===defaultTemplateId?'':entityButton('设为默认','default-content',template.id))+'</div></div>').join('')+'</div></section>';
}
function openTemplateEditor(template){
  editingTemplate=template?.id??'';
  dialog.innerHTML='<h2 id="editor-title">'+(template?'编辑内容模板':'新增内容模板')+'</h2>'+
    '<label class="field">模板名称<input id="content-name" maxlength="80" value="'+safe(template?.name)+'"></label>'+

function unverified(item,site){
  const groups=site?[item.daily?.verify?.[site.id]??[]]:Object.values(item.daily?.verify??{});
  return groups.reduce((sum,keys)=>sum+keys.filter(key=>pairLedger.get(key)?.status==='verify').length,0);
}
function metrics(site,batchItem=batch){
  const width=batchItem.links.length, index=site?batchItem.sites.indexOf(site):-1;
  const start=index<0?0:index*width;
  const total=index<0?batchItem.sites.length*width:width;
  // One deliberately held row belongs to the first site.
  const held=batchItem.manual&&start===0?1:0;
  const regular=index>=0&&batchItem.daily?batchItem.daily.positions[index]:Math.max(0,Math.min(total,batchItem.cursor-start));
  const pending=held&&!batchItem.resolved?1:0;
  const dealt=Math.max(0,regular-pending-unverified(batchItem,site));
  return {total,dealt,pending,percent:Math.floor(dealt*100/total)};
}
function sample(site){
  const targets=site?[site]:batch.sites.slice(0,4);
  return targets.flatMap(target=>batch.links.slice(0,5).map((link,offset)=>{
    const index=batch.sites.indexOf(target)*batch.links.length+offset;
    const pending=index===0&&batch.manual&&!batch.resolved;
    const siteIndex=batch.sites.indexOf(target);
    const complete=(batch.daily?offset<batch.daily.positions[siteIndex]:index<batch.cursor)&&!pending;
    const skipped=batch.daily?.skipped[target.id]?.includes(link.url);
    const shared=batch.mode==='execute'?pairLedger.get(pairKey(target,link)):undefined;
    const sameWork=shared?.owner!==batch.id;
    const waiting=shared?.status==='processing';
    const retry=shared?.status==='retry'||batch.daily?.retry?.siteId===target.id&&batch.daily.retry.offset===offset;
    const status=shared?.status==='verify'?'待核验':skipped?'已跳过':pending?'需人工':complete?'已处理':waiting?(sameWork?'等待共享结果':'处理中'):retry?'待重试':'排队中';
    const result=shared?.status==='verify'?shared.result:skipped?(shared?.result?'复用批次 '+shared.owner+' 的结果 · '+shared.result:'历史已提交'):
      waiting?(sameWork?'批次 '+shared.owner+' 正在处理':'正在等待处理结果'):
      retry?'提交前临时失败，等下一周期':pending?'等待核对账号':!complete?'等待继续':batch.mode==='analysis'?'仅分析 · 已检查入口':
      shared?.result??simulatedResults[index%3];
    return {target,link,status,result,content:shared?.content};
  }));
}

const pageSize=8;
function batchStatus(item){
  const total=item.sites.length*item.links.length;
  if(item.cursor===total&&(!item.manual||item.resolved)&&!unverified(item))return ['completed','已完成'];
  if(item.stopped)return ['stopped','已停止'];
  if(item.interrupted)return ['interrupted','已中断'];
  if(item.paused)return ['paused','已暂停'];
  if(item.cursor===total)return unverified(item)?['verification','待核验']:['waiting','待人工'];
  if(item.daily?.nextAt&&(item.daily.nextAt>demoNow()||!item.daily.recurring&&!item.daily.allowed))return ['budget','待下轮'];
  return ['running','执行中'];
}

function parseLines(value){
  const urls=new Map();
  for(const [index,line] of value.split(/\r?\n/).entries()){
    try {
      const url=new URL(line.trim());
      if(!['https:','http:'].includes(url.protocol)||url.username||url.password)continue;
      url.hash='';
      if(!urls.has(url.href))urls.set(url.href,index+1);
    }catch{}
  }
  return [...urls].map(([url,line])=>({url,line}));
}
function advance(targets=batches){
  let changed=false;
  for(const item of targets){
    const total=item.sites.length*item.links.length;
    if(item.paused||item.interrupted||item.stopped||item.cursor>=total)continue;
    if(item.daily){void processCycle(item);continue}
    item.manual=true;
    item.cursor=Math.min(total,item.cursor+Math.max(1,Math.ceil(total/5)));
    changed=true;
  }
  if(changed)updateProgress()
}

  }
  if(event.target.id==='import-list-name')imports.links.name=event.target.value;
  if(event.target.id==='site-search'){query=event.target.value;refreshSection('sites')}
  if(event.target.id==='task-search'){taskQuery=event.target.value;taskPageIndex=0;document.querySelector('#task-rows').innerHTML=taskRows()}
  if(event.target.id==='library-search'){libraryQuery=event.target.value;libraryPageIndex=0;document.querySelector('#library-rows').innerHTML=libraryRows()}
  if(event.target.id==='batch-name')batchName=event.target.value;
  if(event.target.id==='limit'){limit=Math.max(0,Math.min(10000,Math.floor(Number(event.target.value)||0)));refreshSection('limit')}
});
document.addEventListener('change',event=>{
  const input=event.target;
  if(input.dataset.site){if(input.checked)picked.add(input.dataset.site);else picked.delete(input.dataset.site);persist();refreshSection('sites')}
  if(input.id==='pending-sites'){pendingSitesOnly=input.checked;refreshSection('sites')}
  if(input.id.startsWith('file-')&&input.files[0]){
    const kind=input.id.slice(5),draft=imports[kind],file=input.files[0];
    if(!/\.(txt|csv)$/i.test(file.name)||file.size>2_000_000){
      draft.rows=null;draft.error='请选择小于 2 MB 的 TXT 或单列 CSV 文件。';render();return;
    }
    void file.text().then(value=>{
      draft.text=value;draft.saved=false;draft.filename=file.name;draft.format=file.name.toLowerCase().endsWith('.csv')?'csv':'txt';
      draft.rows=compareImport(value,kind,draft.format);draft.error=draft.rows.length?'':'文件没有可检查的内容。';
      if(view==='library')render();
    }).catch(()=>{draft.rows=null;draft.error='未能读取文件。';if(view==='library')render()});
  }
  if(input.id==='task-filter'){taskFilter=input.value;taskPageIndex=0;render()}
  if(input.id==='shared-list'){listId=input.value;persist();render()}
  if(input.id==='scope'){scope=input.value;render()}
  if(input.id==='content-strategy'){contentStrategy=input.value;render()}
  if(input.dataset.contentId){
    pickedTemplates??=new Set([defaultTemplateId]);
    if(input.checked)pickedTemplates.add(input.dataset.contentId);else pickedTemplates.delete(input.dataset.contentId);
    document.querySelector('#content-count').textContent='已选 '+pickedTemplates.size+' 份模板';
    main.querySelector('[data-action=start]').disabled=!canStartBatch();
  }
  if(input.id==='mode'){mode=input.value;render()}
  if(input.id==='daily-limit')dailyLimit=integerQuota(input.value);
  if(input.id==='limit-site'){limitSite=input.value;render()}
  if(input.id==='site-limit'&&limitSite)overrides[limitSite]=integerQuota(input.value);
  if(input.id==='recurring')recurring=input.checked;
});
let lastTick=performance.now();
document.addEventListener('click',event=>{
  const control=event.target.closest('[data-action]');
  const action=control?.dataset.action,key=control?.dataset.key;
  if(!action)return;
  if(['setup','tasks','library','settings'].includes(action)){
    libraryFromSetup=false;settingsFromSetup=false;view=action;notice='';render();window.scrollTo(0,0);return;
  }
  if(action==='manage-content'){view='settings';settingsFromSetup=true;notice='';render();window.scrollTo(0,0);return}
  if(action==='return-content'){view='setup';settingsFromSetup=false;notice='';render();main.querySelector('[data-action=manage-content]')?.focus();return}
  if(action==='new-content'||action==='edit-content'){
    openTemplateEditor(contentTemplates.find(template=>template.id===key));return;
  }
  if(action==='default-content'){defaultTemplateId=key;persist();render();return}
  if(action==='save-content'){
    const name=document.querySelector('#content-name').value.trim();
    const title=document.querySelector('#content-title').value.trim();
    const body=document.querySelector('#content-body').value.trim();
    if(!name||!title||!body){
      document.querySelector('#content-error').textContent='请填写模板名称、标题和正文。';return;
    }
    if(editingTemplate){
      contentTemplates=contentTemplates.map(template=>template.id===editingTemplate&&
        (template.name!==name||template.title!==title||template.body!==body)?
        {...template,name,title,body,revision:template.revision+1}:template);
    }else contentTemplates=[...contentTemplates,{id:crypto.randomUUID(),revision:1,name,title,body}];
    dialog.close();persist();render();return;
  }
  if(action==='return-setup'){notice='';returnToSetup();return}
  if(action==='use-library'){
    if(libraryTab==='sites'){picked.add(key);pendingSitesOnly=false;query=''}
    else listId=key;
    notice='已从清单带回所选'+(libraryTab==='sites'?'站点。':'外链。');
    returnToSetup();return;
  }
  if(action.startsWith('review-')){
    const kind=action.slice(7),draft=imports[kind];
    draft.rows=compareImport(draft.text,kind,draft.format);
    draft.error=draft.rows.length?'':'请先填写或上传网址。';
    open.add('import-'+kind);render();return;
  }
  if(action.startsWith('accept-')){
    const kind=action.slice(7),draft=imports[kind],rows=compareImport(draft.text,kind,draft.format);
    const valid=rows.filter(row=>row.status==='new'||row.status==='existing');
    if(kind==='sites'){
      const added=valid.filter(row=>row.status==='new').map(row=>({id:row.previous?.id??crypto.randomUUID(),name:row.name,url:row.url}));
      const restored=new Set(added.map(site=>site.id));
      sites=[...sites.filter(site=>!restored.has(site.id)),...added];
      if(libraryFromSetup){
        for(const site of [...added,...valid.flatMap(row=>row.status==='existing'&&row.previous?[row.previous]:[])])picked.add(site.id);
        query='';pendingSitesOnly=false;
      }
      notice='已新增 '+added.length+' 个站点，已有站点保留原记录。';
    }else{
      if(!valid.length)return;
      const newListId=crypto.randomUUID();
      if(libraryFromSetup)listId=newListId;
      const name=draft.name.trim()||draft.filename?.replace(/\.[^.]+$/,'')||'外链清单 '+(linkLists.length+1);
      linkLists=[...linkLists,{id:newListId,name,source:draft.filename?draft.format:'paste',links:valid.map(row=>({id:'row-'+row.line,line:row.line,url:row.url}))}];
      notice='已保存 '+valid.length+' 条有效外链。已有外链可在新清单复用。';
    }
    if(rows.some(row=>row.status==='error'))notice+=' 有问题的行未加入。';
    draft.rows=rows;draft.saved=true;
    if(libraryFromSetup){returnToSetup();return}
    libraryQuery='';persist();render();return;
  }
  if(action==='select-all'){for(const site of matchSites())picked.add(site.id);persist();refreshSection('sites');return}
  if(action==='clear'){picked.clear();persist();refreshSection('sites');return}
  if(action==='open-task'){batch=batches.find(item=>String(item.id)===key);scope='';view='progress';open.add('report')}
  if(action==='demo-concurrent'){
    const id=(batches.at(-1)?.id??0)+1;
    const site=demoSites[2],link={id:'demo-overlap-'+id,line:1,url:'https://concurrent-'+id+'.example/submit'};
    const created=['去重演示 A','去重演示 B'].map((name,index)=>({
      id:id+index,name,sites:[site],links:[link],mode:'execute',cursor:0,
      daily:{sharedPairs:true,defaultQuota:10,recurring:true,quotas:{[site.id]:10},positions:[0],skipped:{},nextAt:0,
        allowed:false,injectedFailure:false,demoDelay:1000}
    }));
    batches.push(...created);
    batch=created[1];scope='';view='progress';open.add('report');
    lastTick=performance.now();
    advance(created);render();return;
  }
  if(action==='demo-history'){
    const examples=[['品牌目录回访',5,false,false],['社区测试批次',2,true,false],['海外目录检查',2,false,true]];
    batches=examples.map(([name,cursor,paused,interrupted],index)=>({id:index+1,name,sites:demoSites.slice(0,1),links:demoLinks.slice(0,5),
      mode:'analysis',cursor,paused,interrupted,manual:cursor>0,resolved:cursor===5}));
  }
  if(['task-prev','task-next','library-prev','library-next'].includes(action)){
    const step=action.endsWith('-next')?1:-1;
    if(action.startsWith('task-'))taskPageIndex+=step;else libraryPageIndex+=step;
  }
  if(['manage-sites','manage-links','library-sites','library-links'].includes(action)){
    const fromSetup=action.startsWith('manage-');
    view='library';libraryTab=action.endsWith('sites')?'sites':'links';libraryQuery='';libraryPageIndex=0;
    if(fromSetup){
      libraryFromSetup=true;
      const draft=imports[libraryTab];
      if(draft.saved)Object.assign(draft,{text:'',filename:'',format:'txt',name:'',rows:null,saved:false,error:''});
      open.add('import-'+libraryTab);
      notice='';render();window.scrollTo(0,0);return;
    }
  }
  const records=libraryTab==='sites'?sites:linkLists;
  if(action==='edit-library'){openEditor(records.find(item=>item.id===key));return}
  if(action==='delete-site'){
    const site=sites.find(item=>item.id===key&&!item.deleted);
    if(!site)return;
    dialog.innerHTML='<h2 id="editor-title">删除推广站点？</h2><p>'+safe(site.name)+'</p>'+
      '<p>该站点将从清单和新批次选项移除。已启动批次仍按原清单执行，可在任务页单独停止。</p>'+
      '<div class="actions">'+entityButton('确认删除','confirm-delete-site',site.id)+btn('取消','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-delete-site'){
    sites=sites.map(site=>site.id===key?{...site,deleted:true}:site);
    picked.delete(key);
    if(limitSite===key)limitSite='';
    dialog.close();
    notice='站点已删除。历史批次仍可查看。';
    persist();render();return;
  }
  if(action==='close-dialog'){dialog.close();return}
  if(action==='save-edit'){
    const isSite=libraryTab==='sites';
    const site=isSite?sites.find(item=>item.id===editing):undefined;
    const name=site?.name??document.querySelector('#edit-name').value.trim();
    const rows=isSite?[]:parseLines(document.querySelector('#edit-links').value);
    const url=isSite?checkedUrl(document.querySelector('#edit-url').value,'sites'):undefined;
    if(isSite&&(!url||url.hostname!==name)){
      document.querySelector('#editor-error').textContent='请输入同域名的有效网址。更换域名请添加新站点。';return;
    }
    if(!isSite&&(!name||!rows.length)){
      document.querySelector('#editor-error').textContent='请填写清单名称和有效外链网址。';return;
    }
    if(isSite)sites=sites.map(item=>item.id===editing?{...item,url:url.href}:item);
    else linkLists=linkLists.map(list=>{
      if(list.id!==editing)return list;
      const unchanged=rows.length===list.links.length&&rows.every((row,index)=>row.url===list.links[index].url);
      return {...list,name,links:unchanged?list.links:rows.map(row=>({...row,id:'row-'+row.line}))};
    });
    dialog.close();
  }
  if(action==='start'&&canStartBatch()){
    const list=currentList();
    batch={id:(batches.at(-1)?.id??0)+1,name:batchName.trim(),listName:list.name,sites:selected(),links:list.links.slice(0,perSite()),mode,source:list.source,
      cursor:0,paused:false,interrupted:false,manual:false,resolved:false};batchName='';
    if(mode==='execute'){
      batch.publication=contentStrategy==='ai'?{strategy:'ai'}:
        {strategy:'templates',templates:chosenTemplates().map(template=>({...template}))};
      batch.daily={sharedPairs:true,defaultQuota:dailyLimit,recurring,quotas:Object.fromEntries(batch.sites.map(site=>[site.id,Object.hasOwn(overrides,site.id)?overrides[site.id]:dailyLimit])),
        positions:batch.sites.map(()=>0),skipped:{},nextAt:0,reason:'',allowed:false,injectedFailure:false};
    }
    batches.push(batch);
    pickedTemplates=null;contentStrategy='templates';
    scope='';view='progress';lastTick=performance.now();open.add('report');
  }
  if(action==='advance'){lastTick=performance.now();advance([batch]);return}
  if(action==='pause'){batch.paused=true;lastTick=performance.now()}
  if(action==='resume'){batch.paused=false;batch.interrupted=false;batch.stopped=false;lastTick=performance.now()}
  if(action==='next-cycle'){
    clockShift+=DAY;
    if(batch.daily)batch.daily.allowed=true;
    lastTick=performance.now();advance();return;
  }
  if(action==='stop'){
    dialog.innerHTML='<h2 id="editor-title">停止当前批次？</h2><p>停止后关闭自动执行并保留结果。手动继续可重新启用原有周期。</p><div class="actions">'+btn('确认停止','confirm-stop')+btn('返回','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-stop'){batch.stopped=true;batch.paused=false;batch.interrupted=false;dialog.close()}
  if(action==='interrupt'){
    dialog.innerHTML='<h2 id="editor-title">中断当前批次？</h2><p>停止该批次并保留已经处理的记录。以后可以从保存的进度继续。</p><div class="actions">'+btn('确认中断','confirm-interrupt')+btn('返回','close-dialog','secondary')+'</div>';
    dialog.showModal();return;
  }
  if(action==='confirm-interrupt'){batch.interrupted=true;batch.paused=false;dialog.close()}
  if(action==='resolve')batch.resolved=true;
  if(action==='export'){exportSample();return}
  if(action==='save-model'){
    model={type:document.querySelector('#model-type').value,endpoint:document.querySelector('#endpoint').value,
      name:document.querySelector('#model-name').value,analysis:document.querySelector('#model-analysis').checked,writing:document.querySelector('#model-writing').checked};
    notice='已保存本次演示设置。';render();return;
  }
  notice='';persist();render();
});
setInterval(()=>{if(performance.now()-lastTick>=4500){lastTick=performance.now();advance()}},300);
render();
</script>
</html>
