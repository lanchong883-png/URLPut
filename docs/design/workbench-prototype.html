<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URLPut · 侧边栏交互原型</title>
<style>
:root{color-scheme:light;font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#172c2b;background:#e8eeed;--muted:#536866;--line:#d5e2de;--accent:#14604f;--soft:#e8f4ee;--warm:#fff3db}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #188568;outline-offset:3px}
.panel{max-width:392px;margin:0 auto;min-height:100vh;background:#f3f7f6;border-inline:1px solid var(--line);box-shadow:0 3px 25px #203f3420}
header{padding:14px 15px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-weight:800;font-size:19px;letter-spacing:-.035em}.bar,.row,.actions{display:flex;align-items:center;gap:8px;min-width:0}.bar,.row{justify-content:space-between}.actions{flex-wrap:wrap}.grow{flex:1}.muted,small{color:var(--muted)}.hint{font-size:12px;color:var(--muted)}nav{display:flex;gap:16px;margin-top:7px}nav button{background:none;border:0;padding:6px 2px;color:var(--muted);border-bottom:2px solid transparent}nav button[aria-current]{font-weight:750;color:var(--accent);border-bottom-color:var(--accent)}
main{padding:12px 14px 20px}h1,h2,h3,p{margin:0}h1{font-size:18px;margin-bottom:8px}h2{font-size:14px}h3{font-size:13px}.card,details{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;padding:10px 11px}.card p,details p{margin:5px 0}summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}summary small{font-weight:500}details[open] summary{margin-bottom:9px}.stack{display:grid;gap:7px}.list{max-height:186px;overflow:auto}.item{padding:6px 0;border-bottom:1px solid #e7eeeb;overflow-wrap:anywhere}.item:last-child{border-bottom:none}.item label{display:flex;align-items:flex-start;gap:7px}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
input:not([type=radio],[type=checkbox]),select,textarea{width:100%;min-width:0;padding:6px 7px;border:1px solid #b9cbc4;border-radius:6px;background:#fff}textarea{resize:vertical}label.field{display:grid;gap:3px;margin:5px 0}.check{display:flex;align-items:center;gap:6px}.check input{margin:0}.button{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:5px 9px;border-radius:7px;font-weight:700}.secondary{background:#fff;color:var(--accent);border-color:#b8cec5}.subtle{background:transparent;color:var(--accent);border-color:transparent}.full{width:100%;padding:8px}.chip{display:inline-block;border-radius:99px;background:var(--soft);padding:2px 7px;color:var(--accent);font-size:11px;font-weight:700;white-space:nowrap}.chip.warm{background:var(--warm);color:#755316}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}.stats div{background:#edf5f2;border-radius:7px;padding:6px 8px}.stats strong{display:block;font-size:19px;line-height:1.1}.meter{height:8px;background:#e2ece8;border-radius:99px;overflow:hidden;margin:7px 0}.meter div{height:100%;background:#248366}.notice{min-height:1em;color:var(--accent);font-size:12px;margin-top:6px}.links{overflow-wrap:anywhere}.settings{font-size:12px}
</style>
<div class="panel">
<header><div class="bar"><div class="brand">URLPut</div><span class="chip">模拟演示</span><button class="button secondary settings" data-action="settings">设置</button></div><nav id="nav" aria-label="插件导航"></nav></header>
<main id="main"></main>
</div>
<script>
const numbers = new Intl.NumberFormat('zh-CN');
const n = value => numbers.format(value);
const demoSites = Array.from({length:100},(_,i)=>({id:'site-'+(i+1),name:'推广站点 '+String(i+1).padStart(3,'0'),url:'https://brand-'+(i+1)+'.example/'}));
const demoLinks = Array.from({length:1000},(_,i)=>({id:'row-'+(i+1),line:i+1,url:'https://channel-'+(i+1)+'.example/submit'}));
const storageKey = 'urlput-panel-prototype-v2';
let saved;
try {saved=JSON.parse(localStorage.getItem(storageKey))}catch{}
let sites=saved?.sites??demoSites, links=saved?.links??demoLinks, batches=saved?.batches??[];
let batch=batches.find(item=>item.id===saved?.batchId)??batches.at(-1)??null;
let picked=new Set(saved?.picked??[]), view='setup', query='', scope='', source='csv', limit=1000, mode='analysis', notice='';
let open=new Set(['sites']), model={type:'local',endpoint:'http://127.0.0.1:11434/v1',name:'',analysis:false,writing:false};
const main = document.querySelector('#main'), nav = document.querySelector('#nav');
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({sites,links,batches,batchId:batch?.id,picked:[...picked]}))}catch{}}
const safe = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const btn = (label,action,style='')=>'<button class="button '+style+'" data-action="'+action+'">'+label+'</button>';
const detail = (id,title,body)=>'<details data-section="'+id+'" '+(open.has(id)?'open':'')+'><summary>'+title+'</summary>'+body+'</details>';
const matchSites=()=>sites.filter(site=>(site.name+' '+site.url).toLowerCase().includes(query.toLowerCase()));
const selected=()=>sites.filter(site=>picked.has(site.id));
const perSite=()=>Math.min(links.length,limit);
function setup(){
  const visible=matchSites();
  const selectors=visible.slice(0,20).map(site=>'<div class="item"><label><input type="checkbox" data-site="'+safe(site.id)+'" '+(picked.has(site.id)?'checked':'')+'><span>'+safe(site.name)+'<small class="truncate">'+safe(site.url)+'</small></span></label></div>').join('');
  return '<h1>新建批次</h1>'+
    detail('sites','1. 推广站点 <small>· 已选 '+n(picked.size)+' / '+n(sites.length)+'</small>',
      '<p class="hint">推广站点是你要推广的网站。外链清单在下一步导入。</p>'+
      '<label class="field">搜索站点<input id="site-search" value="'+safe(query)+'" placeholder="名称或域名"></label>'+
      '<div class="actions">'+btn('全选搜索结果','select-all','secondary')+btn('清空选择','clear','subtle')+'</div>'+
      '<div class="list">'+(selectors||'<p class="hint">没有匹配站点。</p>')+'</div>'+
      (visible.length>20?'<p class="hint result-count">展示前 20 个，共 '+n(visible.length)+' 个匹配。全选包含所有匹配站点。</p>':'')+
      '<details data-section="edit-sites" '+(open.has('edit-sites')?'open':'')+'><summary>导入推广站点清单</summary><label class="field">每行一个站点网址<textarea id="site-input" rows="3" placeholder="https://your-site.example/"></textarea></label>'+btn('保存站点清单','save-sites','secondary')+' '+btn('恢复 100 个示例站点','demo-sites','subtle')+'</details>')+
    detail('links','2. 外链清单 <small>· '+n(links.length)+' 条可用候选</small>',
      '<label class="field">导入方式<select id="source"><option value="csv">CSV 文件</option><option value="excel">Excel 工作表</option><option value="txt">TXT 文件</option><option value="paste">直接粘贴</option></select></label>'+
      '<label class="field">粘贴外链网址，每行一条<textarea id="link-input" rows="3" placeholder="https://directory.example/submit"></textarea></label>'+
      '<p class="hint">可演示 1,000 条共享候选。CSV、Excel 和 TXT 在此原型中使用内置样本。</p>'+
      '<div class="actions">'+btn('载入 1,000 条示例','demo-links','secondary')+btn('使用粘贴清单','save-links','subtle')+'</div>'+
      '<p class="hint links">'+safe(links[0]?.url??'未载入外链')+'</p>')+
    '<section class="card"><h2>启动预览</h2><label class="field">每站最多使用<input id="limit" type="number" min="1" max="10000" value="'+safe(limit)+'"></label>'+
    '<div class="stats"><div><strong id="per-site">'+n(perSite())+'</strong><small>每站候选</small></div><div><strong id="combinations">'+n(picked.size*perSite())+'</strong><small>站点 × 外链组合</small></div></div>'+
    '<p class="hint">每个已选推广站点都用同一份外链清单。历史投稿和同平台跳过会影响实际尝试数。</p>'+
    '<label class="field">执行方式<select id="mode"><option value="analysis">仅分析</option><option value="execute">分析后执行（模拟）</option></select></label>'+
    '<button class="button full" data-action="start" '+(!picked.size||!perSite()?'disabled':'')+'>启动模拟批次</button><p class="notice" role="status">'+safe(notice)+'</p></section>';
}
function metrics(site){
  const width=batch.links.length, index=site?batch.sites.indexOf(site):-1;
  const start=index<0?0:index*width;
  const total=index<0?batch.sites.length*width:width;
  // One deliberately held row belongs to the first site.
  const held=batch.manual&&start===0?1:0;
  const regular=Math.max(0,Math.min(total,batch.cursor-start));
  const pending=held&&!batch.resolved?1:0;
  const dealt=Math.max(0,regular-pending);
  return {total,dealt,pending,percent:Math.floor(dealt*100/total)};
}
function sample(site){
  const targets=site?[site]:batch.sites.slice(0,4);
  return targets.flatMap(target=>batch.links.slice(0,5).map((link,offset)=>{
    const index=batch.sites.indexOf(target)*batch.links.length+offset;
    const pending=index===0&&batch.manual&&!batch.resolved;
    const complete=index<batch.cursor&&!pending;
    return {target,link,status:pending?'需人工':complete?'已处理':'排队中'};
  }));
}
function progress(){
  if(!batch)return '<h1>任务进度</h1><section class="card"><p>还没有批次。</p>'+btn('新建批次','setup')+'</section>';
  const site=batch.sites.find(site=>site.id===scope);
  const m=metrics(site), overall=metrics();
  const finished=overall.dealt===overall.total;
  const waiting=!finished&&batch.cursor===overall.total;
  const status=finished?'批次已完成':waiting?'等待人工处理':batch.paused?'已暂停':'执行中';
  const records=sample(site);
  return '<h1>任务进度</h1><section class="card">'+
    (batches.length>1?'<label class="field">演示批次<select id="batch-picker">'+batches.map(item=>'<option value="'+item.id+'" '+(item===batch?'selected':'')+'>批次 '+item.id+' · '+n(item.sites.length)+' 站 × '+n(item.links.length)+' 条</option>').join('')+'</select></label>':'')+
    '<div class="row"><h2>'+status+'</h2><span class="chip">'+(batch.mode==='analysis'?'仅分析':'模拟执行')+'</span></div>'+
    '<p class="hint">'+n(batch.sites.length)+' 个推广站点 · 每站 '+n(batch.links.length)+' 条 · 批次快照</p>'+
    '<label class="field">查看范围<select id="scope"><option value="">全部站点</option>'+batch.sites.map(site=>'<option value="'+safe(site.id)+'" '+(site.id===scope?'selected':'')+'>'+safe(site.name)+'</option>').join('')+'</select></label>'+
    '<div class="meter" role="progressbar" aria-label="已处理比例" aria-valuenow="'+m.percent+'"><div style="width:'+m.percent+'%"></div></div>'+
    '<div class="row"><span>已处理 '+n(m.dealt)+' / '+n(m.total)+'</span><strong>'+m.percent+'%</strong></div>'+
    (!finished&&!waiting?'<div class="actions" style="margin-top:7px">'+btn(batch.paused?'继续':'暂停','pause','secondary')+(!batch.paused?btn('推进一步','advance','subtle'):'')+'</div>':'')+'</section>'+
    (m.pending?'<section class="card"><div class="row"><h2>人工待办</h2><span class="chip warm">1 条</span></div><p>'+safe(batch.sites[0].name)+' → '+safe(batch.links[0].url)+'</p><p class="hint">核对站点专用账号。其他组合继续运行。</p>'+btn('已确认，恢复该条','resolve','secondary')+'</section>':'')+
    detail('report','记录与导出 <small>· 当前范围抽样</small>',
      '<p class="hint">每条都保留推广站点、来源行和外链网址。</p>'+
      '<div class="list">'+records.map(({target,link,status})=>'<div class="item"><div class="row"><strong>'+safe(target.name)+'</strong><span class="chip">'+status+'</span></div><small class="links">第 '+link.line+' 行 · '+safe(link.url)+'</small></div>').join('')+'</div>'+
      btn('导出演示样本 CSV','export','secondary')+'<p class="notice" role="status" id="export-notice"></p>');
}
function settings(){
  return '<h1>设置</h1><section class="card"><h2>AI 模型</h2><label class="field">服务类型<select id="model-type"><option value="local">本地模型</option><option value="custom">自建模型服务</option></select></label><label class="field">API 地址<input id="endpoint" value="'+safe(model.endpoint)+'"></label><label class="field">模型名<input id="model-name" value="'+safe(model.name)+'"></label><div class="actions"><label class="check"><input id="model-analysis" type="checkbox" '+(model.analysis?'checked':'')+'>AI 分析</label><label class="check"><input id="model-writing" type="checkbox" '+(model.writing?'checked':'')+'>AI 文案</label></div><p class="hint">只演示配置，页面不会发起模型请求。</p>'+btn('模拟保存','save-model','secondary')+'<p class="notice" role="status">'+safe(notice)+'</p></section>';
}
function render(){
  nav.innerHTML=[['setup','新建批次'],['progress','任务进度']].map(([id,label])=>'<button data-action="'+id+'" '+(view===id?'aria-current="page"':'')+'>'+label+'</button>').join('');
  main.innerHTML={setup,progress,settings}[view]();
  if(view==='setup'){document.querySelector('#source').value=source;document.querySelector('#mode').value=mode}
  if(view==='settings')document.querySelector('#model-type').value=model.type;
}
function refreshSection(id){
  const before=main.querySelector('[data-section="'+id+'"]');
  const template=document.createElement('template');
  template.innerHTML=setup();
  const after=template.content.querySelector('[data-section="'+id+'"]');
  if(id==='sites'){
    before.querySelector('summary').innerHTML=after.querySelector('summary').innerHTML;
    before.querySelector('.list').innerHTML=after.querySelector('.list').innerHTML;
    const oldHint=before.querySelector('.result-count');
    if(oldHint)oldHint.remove();
    if(matchSites().length>20){
      const text=document.createElement('p');text.className='hint result-count';
      text.textContent='展示前 20 个，共 '+n(matchSites().length)+' 个匹配。全选包含所有匹配站点。';
      before.querySelector('.list').after(text);
    }
  }
  document.querySelector('#per-site').textContent=n(perSite());
  document.querySelector('#combinations').textContent=n(picked.size*perSite());
  main.querySelector('[data-action=start]').disabled=!picked.size||!perSite();
}
function parseLines(value){
  const urls=new Map();
  for(const [index,line] of value.split(/\r?\n/).entries()){
    try {
      const url=new URL(line.trim());
      if(!['https:','http:'].includes(url.protocol)||url.username||url.password)continue;
      url.hash='';
      if(!urls.has(url.href))urls.set(url.href,index+1);
    }catch{}
  }
  return [...urls].map(([url,line])=>({url,line}));
}
function advance(targets=batches){
  let changed=false;
  for(const item of targets){
    const total=item.sites.length*item.links.length;
    if(item.paused||item.cursor>=total)continue;
    item.manual=true;
    item.cursor=Math.min(total,item.cursor+Math.max(1,Math.ceil(total/5)));
    changed=true;
  }
  if(changed){persist();if(view==='progress')render()}
}
function exportSample(){
  const site=batch.sites.find(site=>site.id===scope);
  const rows=[['推广站点','推广站点网址','外链 URL','外链来源行','状态'],
    ...sample(site).map(({target,link,status})=>[target.name,target.url,link.url,link.line,status])];
  const csv=rows.map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
  const anchor=document.createElement('a');anchor.href=url;anchor.download='URLPut-演示批次记录.csv';anchor.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  document.querySelector('#export-notice').textContent='已导出 '+(rows.length-1)+' 条演示记录。';
}
document.addEventListener('toggle',event=>{
  const id=event.target.dataset?.section;
  if(!id||!event.target.isConnected)return;
  if(event.target.open)open.add(id);else open.delete(id);
},true);
document.addEventListener('input',event=>{
  if(event.target.id==='site-search'){query=event.target.value;refreshSection('sites')}
  if(event.target.id==='limit'){limit=Math.max(0,Math.min(10000,Math.floor(Number(event.target.value)||0)));refreshSection('limit')}
});
document.addEventListener('change',event=>{
  const input=event.target;
  if(input.dataset.site){if(input.checked)picked.add(input.dataset.site);else picked.delete(input.dataset.site);persist();refreshSection('sites')}
  if(input.id==='batch-picker'){batch=batches.find(item=>String(item.id)===input.value);scope='';persist();render()}
  if(input.id==='scope'){scope=input.value;render()}
  if(input.id==='source')source=input.value;
  if(input.id==='mode')mode=input.value;
});
let lastTick=performance.now();
document.addEventListener('click',event=>{
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(!action)return;
  if(['setup','progress','settings'].includes(action)){view=action;notice='';render();window.scrollTo(0,0);return}
  if(action==='select-all'){for(const site of matchSites())picked.add(site.id);persist();refreshSection('sites');return}
  if(action==='clear'){picked.clear();persist();refreshSection('sites');return}
  if(action==='save-sites'){
    const rows=parseLines(document.querySelector('#site-input').value);
    if(!rows.length){notice='请输入至少一个有效站点网址。';document.querySelector('.notice').textContent=notice;return}
    sites=rows.map(({url})=>({id:url,name:new URL(url).hostname,url}));picked=new Set(sites.filter(site=>picked.has(site.id)).map(site=>site.id));query='';
  }
  if(action==='demo-sites'){sites=demoSites;picked.clear();query=''}
  if(action==='demo-links')links=demoLinks;
  if(action==='save-links'){
    const rows=parseLines(document.querySelector('#link-input').value);
    if(!rows.length){notice='请输入至少一个有效外链网址。';document.querySelector('.notice').textContent=notice;return}
    links=rows.map(row=>({...row,id:'row-'+row.line}));source='paste';
  }
  if(action==='start'&&picked.size&&perSite()){
    batch={id:(batches.at(-1)?.id??0)+1,sites:selected(),links:links.slice(0,perSite()),mode,source,cursor:0,paused:false,manual:false,resolved:false};
    batches.push(batch);
    scope='';view='progress';lastTick=performance.now();open.add('report');
  }
  if(action==='advance'){lastTick=performance.now();advance([batch]);return}
  if(action==='pause'){batch.paused=!batch.paused;lastTick=performance.now()}
  if(action==='resolve')batch.resolved=true;
  if(action==='export'){exportSample();return}
  if(action==='save-model'){
    model={type:document.querySelector('#model-type').value,endpoint:document.querySelector('#endpoint').value,
      name:document.querySelector('#model-name').value,analysis:document.querySelector('#model-analysis').checked,writing:document.querySelector('#model-writing').checked};
    notice='已保存本次演示设置。';render();return;
  }
  notice='';persist();render();
});
setInterval(()=>{if(performance.now()-lastTick>=4500){lastTick=performance.now();advance()}},300);
render();
</script>
</html>
