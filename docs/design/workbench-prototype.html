<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URLPut · 交互演示</title>
<style>
:root{color-scheme:light;--ink:#243145;--muted:#5a6b7b;--line:#dce4e9;--paper:#fff;--accent:#155e50;--soft:#e9f4ef;--warm:#fcf1df;--bg:#f3f6f7;font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #16846d;outline-offset:3px}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}aside{background:#152c31;color:#edf8f5;padding:26px 17px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.04em}.logo{display:grid;place-items:center;width:34px;height:34px;background:#b8f1d4;color:#183932;border-radius:10px;font-size:17px}.context{margin:35px 0 14px;color:#a9bdba;font-size:12px}.nav{display:grid;gap:6px}.nav button,.sidebtn{background:none;color:inherit;border:0;border-radius:8px;text-align:left;padding:9px 12px}.nav button:hover,.sidebtn:hover,.nav [aria-current="page"]{background:#28464a}.nav i{display:inline-block;width:22px;font-style:normal}.sidebtn{margin-top:auto}.topbar{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.topbar select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--ink)}.main{max-width:1200px;margin:auto;padding:31px 32px 52px}.heading,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.heading{margin-bottom:19px}.heading h1{font-size:32px;line-height:1.15;margin:0;letter-spacing:-.04em}.heading p{margin:6px 0 0}.muted{color:var(--muted)}.small{font-size:13px}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;background:#eef2f5;color:#435566;font-size:12px;font-weight:650;white-space:nowrap}.chip.green{background:var(--soft);color:#155e50}.chip.amber{background:var(--warm);color:#795215}.chip.red{background:#fcebea;color:#922f2b}.chip.blue{background:#e8f1f8;color:#254f72}.btn{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:650}.btn.subtle{background:#fff;color:var(--ink);border-color:#c9d6dc}.btn.link{background:transparent;color:var(--accent);border-color:transparent;padding-inline:6px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin-bottom:14px}.card h2,.card h3{margin:0 0 7px;letter-spacing:-.02em}.card p{margin:5px 0 12px}.hero{padding:24px;background:#e4f2ec;border-color:#cbded6;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px}.hero h2{font-size:25px}.hero .visual{border-left:1px solid #bdd4c8;padding-left:19px;align-self:center}.visual strong{display:block;font-size:34px;color:var(--accent);line-height:1.2}.meter{height:9px;background:#dfe9eb;border-radius:99px;overflow:hidden;margin:11px 0 6px}.meter div{height:100%;background:#28836d;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{padding:13px 14px;margin:0}.stat strong{display:block;font-size:26px}.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(252px,1fr);gap:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:10px 9px;border-bottom:1px solid #e8edf0;vertical-align:top}th{font-size:12px;color:var(--muted);white-space:nowrap}td:first-child{white-space:nowrap}.url{overflow-wrap:anywhere;color:#385568}.steps{display:flex;gap:15px;margin-bottom:15px;flex-wrap:wrap}.step{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:650}.step span{width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line);border-radius:100%;font-size:12px;background:#fff}.step.on{color:var(--accent)}.step.on span{background:var(--accent);color:#fff;border-color:var(--accent)}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.tabs .chosen{background:var(--soft);color:var(--accent);border-color:#b1d2c1}.field{display:grid;gap:5px;font-weight:650;margin-bottom:10px}.field input,.field select,.field textarea{width:100%;min-height:37px;border:1px solid #c9d6dc;background:#fff;border-radius:7px;padding:6px 9px;color:var(--ink)}textarea{resize:vertical}.stack{display:grid;gap:8px}.task{border-top:1px solid var(--line);padding:11px 0}.task:first-of-type{margin-top:8px}.task p{margin:2px 0 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.callout{border-left:3px solid #b78232;background:#fdf6ec;padding:9px 12px;margin-bottom:11px}.notice{min-height:1.5em;color:#155e50}.dialog{border:1px solid var(--line);border-radius:13px;color:var(--ink);width:min(560px,calc(100% - 30px));padding:20px}.dialog::backdrop{background:#16303480}.dialog h2{margin:0 0 9px}.panel{border:0;padding:19px;height:100vh;max-height:100vh;margin:0 0 0 auto;width:min(370px,100%);background:var(--bg);border-radius:0}.panel .card{margin-top:14px}.timeline{list-style:none;padding:0;margin:6px 0}.timeline li{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}.empty{padding:22px 0;color:var(--muted)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{min-height:auto;padding:12px 15px;gap:8px}.context{display:none}.nav{display:flex;flex-wrap:wrap}.nav button,.sidebtn{padding:5px 8px}.sidebtn{margin:0;align-self:start}.topbar{height:auto;min-height:56px;padding:8px 15px}.main{padding:22px 14px}.hero{grid-template-columns:1fr}.hero .visual{border:0;padding:0}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="app">
<aside><div class="brand"><span class="logo" aria-hidden="true">↗</span> URLPut</div><div class="context">工作空间</div><nav class="nav" id="nav" aria-label="工作台导航"></nav><button class="sidebtn" data-go="panel"><span aria-hidden="true">▣</span> 查看 Chrome 侧边栏</button></aside>
<div><div class="topbar"><div class="controls"><strong>演示工作空间</strong><span class="muted">/</span><label class="small">推广站点 <select id="site"><option>北岸运营</option><option>青禾工具</option></select></label></div><span class="chip green">演示模式 · 模拟数据</span></div><main class="main" id="main"></main></div>
</div>
<dialog class="dialog" id="dialog"></dialog>
<script>
const pages = [['home','◈','总览'],['import','⇧','导入清单'],['tasks','▤','任务与待办'],['report','▥','批次报告'],['sites','◇','推广站点'],['settings','⚙','设置']];
const examples = [
 {id:1, host:'catalog.example', path:'/submit', kind:'目录站', reason:'入口可用，接受产品资料'},
 {id:2, host:'forum.example', path:'/share', kind:'论坛', reason:'需要站点专用账号确认身份'},
 {id:3, host:'blog.example', path:'/resources', kind:'博客', reason:'公开入口符合要求'},
 {id:4, host:'closed.example', path:'/add', kind:'目录站', reason:'页面明确说明暂停接收'},
 {id:5, host:'catalog.example', path:'/submit', kind:'目录站', reason:'与第 1 行重复'},
 {id:6, host:'—', path:'无效网址', kind:'未识别', reason:'缺少可用的 HTTP/HTTPS 地址'}
];
const labels = {queued:'排队中',running:'执行中',manual:'需人工',done:'已完成',skipped:'已跳过',invalid:'输入无效'};
const colors = {queued:'',running:'blue',manual:'amber',done:'green',skipped:'',invalid:'red'};
let state = {page:'home',step:1,source:'csv',mode:'analysis',batchMode:'analysis',filter:'all',started:false,paused:false,turn:0,events:[],selected:'北岸运营',batchSite:'',provider:'local',profiles:{local:{endpoint:'http://127.0.0.1:11434/v1',model:'qwen',analysis:false,writing:false},custom:{endpoint:'https://models.example/v1',model:'team-model',analysis:false,writing:false}}};
let tasks = [];
const main = document.querySelector('#main'), nav = document.querySelector('#nav'), dialog = document.querySelector('#dialog');
const button = (text,key,style='') => '<button class="btn '+style+'" data-go="'+key+'">'+text+'</button>';
const chip = (text,style='') => '<span class="chip '+style+'">'+text+'</span>';
const status = value => chip(labels[value],colors[value]);
const counts = () => {
  const done = tasks.filter(t=>['done','skipped','invalid'].includes(t.status)).length;
  return {total:tasks.length,done,manual:tasks.filter(t=>t.status==='manual').length,running:tasks.filter(t=>t.status==='running').length,percent:tasks.length?Math.round(done/tasks.length*100):0};
};
const meter = percent => '<div class="meter" role="progressbar" aria-label="批次进度" aria-valuenow="'+percent+'"><div style="width:'+percent+'%"></div></div>';
const batchStatus = () => {const c=counts();return !state.started?'尚未创建批次':c.done===c.total?'批次已完成':state.paused?'批次已暂停':c.manual && !c.running && !tasks.some(t=>t.status==='queued')?'等待人工处理':'批次进行中'};
const heading = (title,desc,action='') => '<div class="heading"><div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>';
const url = item => item.id===6?item.path:'https://'+item.host+item.path;
const stat = (name,value) => '<div class="card stat"><span class="muted">'+name+'</span><strong>'+value+'</strong></div>';
const taskStatus = c => '<div class="row"><strong>'+batchStatus()+'</strong>'+chip(c.percent+'%','green')+'</div>'+meter(c.percent)+'<div class="small muted">已处理 '+c.done+' / '+c.total+' 行 · '+c.manual+' 条待人工</div>';
const demoNote = '<p class="small muted">示例批次仅在此页面中模拟，刷新后可重新演示。</p>';

function home(){
  const c=counts();
  return heading('工作台总览','查看处理进度、人工待办和批次结果。',button('导入新清单','new'))+
  '<section class="card hero"><div><h2>'+batchStatus()+'</h2><p class="muted">'+(state.started?'示例清单 · '+state.batchSite+' · '+(state.batchMode==='analysis'?'仅分析':'分析后执行'):'从示例清单开始，查看导入后的任务进展。')+'</p><div class="controls">'+(state.started?button('查看任务','tasks'):button('开始演示','new'))+button('查看批次报告','report','subtle')+'</div></div><div class="visual"><strong>'+c.percent+'%</strong>'+meter(c.percent)+'<span class="small muted">已处理 '+c.done+' / '+c.total+' 行</span></div></section>'+
  '<div class="stats">'+stat('原始行',c.total)+stat('已处理',c.done)+stat('执行中',c.running)+stat('需人工',c.manual)+'</div>'+
  '<div class="split"><section class="card"><h2>最近批次</h2>'+(state.started?'<p>示例清单 · '+state.batchSite+'</p>'+button('打开批次','tasks','subtle'):'<p class="empty">创建批次后，进度会显示在这里。</p>')+'</section><section class="card"><h2>需你处理</h2>'+(c.manual?'<p>论坛入口需要确认品牌账号。</p>'+button('查看待办','manual','subtle'):'<p class="empty">暂无人工待办。</p>')+'</section></div>';
}

function wizard(){
  const steps=['选择来源','预览与校验','确认批次'].map((name,i)=>'<div class="step '+(i+1===state.step?'on':'')+'" '+(i+1===state.step?'aria-current="step"':'')+'><span>'+(i+1)+'</span>'+name+'</div>').join('');
  let content;
  if(state.step===1){
    const types=[['csv','CSV 文件'],['excel','Excel 工作表'],['txt','TXT 文本'],['paste','直接粘贴']];
    content='<section class="card"><h2>导入来源</h2><div class="tabs">'+types.map(([key,name])=>button(name,'source-'+key,'subtle '+(state.source===key?'chosen':''))).join('')+'</div>'+
      (state.source==='excel'?'<label class="field">示例文件与工作表<select><option>推广清单.xlsx · 产品目录</option><option>推广清单.xlsx · 社区渠道</option></select></label>':
       state.source==='paste'?'<label class="field">粘贴内容<textarea rows="3" placeholder="可粘贴内容，也可直接加载示例">https://catalog.example/submit\nhttps://forum.example/share</textarea></label>':
       '<p>示例文件 · '+(state.source==='csv'?'推广清单.csv':'推广清单.txt')+'</p>')+
      demoNote+'<div class="controls">'+button('加载示例并预览','next')+'</div></section>';
  } else if(state.step===2){
    content='<section class="card"><div class="row"><h2>预览结果</h2>'+chip('6 行 · 4 条候选 · 1 条重复 · 1 条无效')+'</div>'+
      (['csv','excel','paste'].includes(state.source)?'<div class="controls"><label>网址列 <select><option>候选网址</option><option>投稿入口</option></select></label><label>入口列 <select><option>投稿入口</option><option>不映射</option></select></label><label><input type="checkbox" checked> 首行为表头</label></div>':'')+
      '<div class="tablewrap"><table><thead><tr><th>序号</th><th>来源</th><th>网址</th><th>校验</th></tr></thead><tbody>'+examples.map(item=>'<tr><td>'+item.id+'</td><td>第 '+(item.id+(state.source==='txt'?0:1))+' 行</td><td class="url">'+url(item)+'</td><td>'+(item.id===5?chip('重复 · 关联第 1 行','amber'):item.id===6?chip('网址无效','red'):chip('有效候选','green'))+'</td></tr>').join('')+'</tbody></table></div>'+
      '<p class="muted small">重复和错误行会保留在报告中。</p><div class="controls">'+button('返回','back','subtle')+button('继续确认','next')+'</div></section>';
  } else {
    content='<section class="card"><h2>执行方式</h2><p>推广站点 · '+state.selected+'　｜　6 个原始行，4 条待处理候选</p><div class="stack"><label><input type="radio" name="mode" value="analysis" '+(state.mode==='analysis'?'checked':'')+'> 仅分析</label><label><input type="radio" name="mode" value="execute" '+(state.mode==='execute'?'checked':'')+'> 分析后执行（模拟）</label></div>'+
      '<p class="muted">'+(state.mode==='analysis'?'读取页面并分析入口。演示中的人工待办代表需要补充账号相关信息。':'演示中会展示模拟核验结果。')+'</p><div class="controls">'+button('返回','back','subtle')+button('确认并启动批次','start')+'</div></section>';
  }
  return heading('导入清单','选择来源，核对逐行结果，再启动批次。')+'<div class="steps">'+steps+'</div>'+content;
}

function taskPage(){
  const c=counts();
  const actionable = state.started && state.turn < 5;
  const controls = actionable?button(state.paused?'继续执行':'暂停执行','pause','subtle')+(!state.paused?button('推进一步','advance','subtle'):''):'';
  const tabs = [['all','全部'],['running','执行中'],['manual','需人工'],['done','已处理']].map(([value,name])=>button(name,'filter-'+value,'subtle '+(state.filter===value?'chosen':''))).join('');
  const filtered = tasks.filter(task=>state.filter==='all'||task.status===state.filter||state.filter==='done'&&['done','skipped','invalid'].includes(task.status));
  return heading('任务与待办','逐行查看当前动作、进展和需要人工处理的事项。',button('查看报告','report','subtle'))+
    '<section class="card">'+taskStatus(c)+'<div class="controls" style="margin-top:11px">'+controls+(!state.started?button('创建演示批次','new'):'')+'</div></section>'+
    '<div class="split"><section class="card"><h2>任务队列</h2><div class="tabs">'+tabs+'</div>'+
    (filtered.length?filtered.map(task=>'<div class="task"><div class="row"><strong>'+task.host+'</strong>'+status(task.status)+'</div><p class="muted small">第 '+task.id+' 行 · '+task.detail+'</p>'+(task.status==='manual'?button('查看人工待办','resolve-'+task.id,'link'):'')+'</div>').join(''):'<p class="empty">当前筛选下没有任务。</p>')+
    '</section><section class="card"><h2>进度记录</h2>'+(state.events.length?'<ol class="timeline">'+state.events.slice(-7).reverse().map(event=>'<li class="small">'+event+'</li>').join('')+'</ol>':'<p class="empty">批次启动后显示事件。</p>')+'</section></div>';
}

function conclusion(task){
  if(task.status==='manual')return ['未成功','需人工','确认账号后恢复当前任务'];
  if(task.status==='invalid')return ['未成功','输入无效',task.reason];
  if(task.status==='skipped')return ['未成功','已跳过','与第 1 行重复'];
  if(task.status!=='done')return ['未成功',labels[task.status],task.detail];
  if(task.id===4)return ['未成功','已关闭投稿',task.reason];
  return state.batchMode==='analysis'?['未成功','仅分析',task.reason]:['提交成功',task.id===3?'待审核':'有效外链',task.id===3?'回执已记录，等待只读回访':'模拟核验通过'];
}

function report(){
  const c=counts();
  return heading('批次报告','原始行、结果与下一步始终可追溯。',state.started?button('演示导出 CSV','export'):'')+
    (!state.started?'<section class="card"><p class="empty">创建演示批次后可查看阶段报告。</p>'+button('创建演示批次','new')+'</section>':
    '<div class="stats">'+stat('原始行',c.total)+stat('已处理',c.done)+stat('需人工',c.manual)+stat('有效外链',tasks.filter(task=>conclusion(task)[1]==='有效外链').length)+'</div><section class="card"><div class="row"><h2>示例批次 · '+state.batchSite+'</h2>'+chip(batchStatus(),'green')+'</div><div class="tablewrap"><table><thead><tr><th>序号</th><th>网站域名</th><th>网站分类</th><th>URL</th><th>结果类别</th><th>结论</th><th>原因与下一步</th></tr></thead><tbody>'+
    tasks.map(task=>{const [result,label,detail]=conclusion(task);return '<tr><td>'+task.id+'</td><td>'+task.host+'</td><td>'+task.kind+'</td><td class="url">'+url(task)+'</td><td>'+result+'</td><td>'+chip(label,task.status==='manual'?'amber':'')+'</td><td>'+detail+'</td></tr>'}).join('')+'</tbody></table></div><p role="status" class="notice" id="notice"></p></section>');
}

function sites(){
  return heading('推广站点','查看品牌资料、身份和内容配置。')+'<section class="card"><h2>'+state.selected+'</h2><div class="split"><div><h3>品牌档案</h3><p class="url">https://'+(state.selected==='北岸运营'?'north.example':'green.example')+'</p><p>支持语言：中文、英语</p></div><div><h3>发布身份</h3><p>品牌专用账号 · 待确认</p><p>允许推广页面 · 首页、产品介绍</p></div></div>'+button('查看资料字段','site-details','subtle')+'</section>';
}

function settings(){
  const p=state.profiles[state.provider];
  return heading('设置','分别配置本地或自建模型，并独立控制分析和文案。')+'<section class="card"><h2>AI 模型</h2><div class="tabs">'+button('本地模型','provider-local','subtle '+(state.provider==='local'?'chosen':''))+button('自建模型服务','provider-custom','subtle '+(state.provider==='custom'?'chosen':''))+'</div>'+
    '<label class="field">API 基础地址<input id="endpoint"></label><label class="field">模型名称<input id="model"></label><label class="field">API 密钥（可选）<input type="password" autocomplete="off" placeholder="演示不保存密钥"></label><div class="controls"><label><input id="analysis" type="checkbox" '+(p.analysis?'checked':'')+'> 启用 AI 分析</label><label><input id="writing" type="checkbox" '+(p.writing?'checked':'')+'> 启用 AI 文案</label></div><p class="muted small">测试连接为模拟操作。</p><div class="controls">'+button('测试连接','test-model','subtle')+button('保存设置','save-model')+'</div><p class="notice" role="status" id="notice"></p></section>';
}

function render(){
  nav.innerHTML=pages.map(([key,icon,name])=>'<button data-go="'+key+'" '+(state.page===key?'aria-current="page"':'')+'><i aria-hidden="true">'+icon+'</i>'+name+'</button>').join('');
  main.innerHTML={home,import:wizard,tasks:taskPage,report,sites,settings}[state.page]();
  if(state.page==='settings'){const p=state.profiles[state.provider];document.querySelector('#endpoint').value=p.endpoint;document.querySelector('#model').value=p.model}
  if(dialog.open && dialog.classList.contains('panel'))updatePanel();
}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function updatePanel(){
  dialog.innerHTML='<div class="row"><div class="brand"><span class="logo" aria-hidden="true">↗</span> URLPut</div>'+button('关闭','close','subtle')+'</div><section class="card"><h2>批次进度</h2>'+taskStatus(counts())+'</section><div class="controls">'+button('打开工作台','panel-home')+button(state.started?'查看任务':'导入清单',state.started?'panel-tasks':'panel-import','subtle')+'</div>';
}
function show(content){dialog.className='dialog';dialog.removeAttribute('aria-label');dialog.setAttribute('aria-labelledby','dialog-title');dialog.innerHTML=content;dialog.querySelector('h2').id='dialog-title';dialog.showModal()}
function setTask(id,status,detail,event){
  Object.assign(tasks.find(task=>task.id===id),{status,detail});
  state.events.push(event);
}
function advance(){
  if(!state.started||state.paused)return;
  const actions=[
    ()=>{setTask(1,'running','读取入口和字段','目录站开始分析');setTask(2,'running','检查登录要求','论坛开始分析')},
    ()=>{setTask(2,'manual','确认品牌专用账号后继续','论坛转为需人工，其他任务继续');setTask(3,'running','查找公开投稿入口','博客开始分析')},
    ()=>{setTask(1,'done',state.batchMode==='analysis'?'入口分析完成':'模拟确认有效外链','目录站处理完成')},
    ()=>{setTask(3,'done',state.batchMode==='analysis'?'公开入口分析完成':'模拟取得接收回执','博客处理完成');setTask(4,'running','核对入口可用性','暂停接收站点开始分析')},
    ()=>setTask(4,'done','确认入口已关闭','入口已关闭，报告保留原因')
  ];
  if(state.turn<actions.length){actions[state.turn++]();if(['home','tasks','report'].includes(state.page))render();else if(dialog.open&&dialog.classList.contains('panel'))updatePanel()}
}
function start(){
  tasks=examples.map(item=>({...item,status:item.id===5?'skipped':item.id===6?'invalid':'queued',detail:item.id>4?item.reason:'等待调度'}));
  Object.assign(state,{started:true,paused:false,turn:0,filter:'all',batchSite:state.selected,batchMode:state.mode,events:['示例批次已创建']});
  go('tasks');
}
function saveDraft(){
  if(state.page!=='settings')return;
  const p=state.profiles[state.provider];
  p.endpoint=document.querySelector('#endpoint').value;p.model=document.querySelector('#model').value;
  p.analysis=document.querySelector('#analysis').checked;p.writing=document.querySelector('#writing').checked;
}
let lastTick=performance.now();
setInterval(()=>{if(performance.now()-lastTick>4500){advance();lastTick=performance.now()}},350);
document.addEventListener('change',event=>{
  if(event.target.name==='mode'){state.mode=event.target.value;render()}
  if(event.target.id==='site'){state.selected=event.target.value;render()}
});
document.addEventListener('click',event=>{
  const key=event.target.closest('[data-go]')?.dataset.go;if(!key)return;
  if(pages.some(([page])=>page===key)){saveDraft();go(key);return}
  if(key==='new'){state.step=1;go('import');return}
  if(key.startsWith('source-')){state.source=key.slice(7);render();return}
  if(key==='next'||key==='back'){state.step+=key==='next'?1:-1;render();return}
  if(key==='start'){lastTick=performance.now();start();return}
  if(key.startsWith('filter-')||key==='manual'){state.filter=key==='manual'?'manual':key.slice(7);go('tasks');return}
  if(key==='advance'){advance();lastTick=performance.now();return}
  if(key==='pause'){state.paused=!state.paused;state.events.push(state.paused?'批次已暂停':'批次继续执行');lastTick=performance.now();render();return}
  if(key.startsWith('resolve-')){
    show('<h2>确认论坛账号</h2><div class="callout">论坛需要核对当前登录身份。其他任务可继续执行。</div><p>若已在模拟页面确认品牌账号，标记完成后继续当前任务。</p><div class="controls">'+button('已确认，继续任务','resolved')+button('暂不处理','close','subtle')+'</div>');return;
  }
  if(key==='resolved'){setTask(2,'done',state.batchMode==='analysis'?'账号要求已确认，分析完成':'模拟完成提交核验','论坛账号已确认，继续原任务并完成');dialog.close();render();return}
  if(key==='panel'){dialog.className='dialog panel';dialog.removeAttribute('aria-labelledby');dialog.setAttribute('aria-label','Chrome 侧边栏');updatePanel();dialog.showModal();return}
  if(key.startsWith('panel-')){dialog.close();go(key.slice(6));return}
  if(key==='close'){dialog.close();return}
  if(key==='site-details'){show('<h2>品牌资料</h2><p>站点名称、主页、品牌简介、行业、联系邮箱、语言、允许推广的页面与发布身份。</p>'+button('关闭','close','subtle'));return}
  if(key.startsWith('provider-')){saveDraft();state.provider=key.slice(9);render();return}
  if(key==='test-model'||key==='save-model'){saveDraft();const p=state.profiles[state.provider];document.querySelector('#notice').textContent=p.endpoint&&p.model?(key==='test-model'?'模拟连接成功，未发送网络请求。':'已保存本次演示的模型设置。'):'请填写地址和模型名称。';return}
  if(key==='export'){document.querySelector('#notice').textContent='已演示 CSV 导出操作。正式报告将包含当前批次全部原始行。'}
});
render();
</script>
</html>
